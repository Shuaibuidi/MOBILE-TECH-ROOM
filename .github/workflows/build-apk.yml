name: Build Mobile Tech Room APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Mobile_Tech_Room_icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor and asset tools
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets

      - name: Prepare app and icon
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp Mobile_Tech_Room_icon.png resources/icon.png

      - name: Create Android project
        run: |
          npx cap init "Mobile Tech Room" "com.shuaibuidi.mobiletechroom" --web-dir www
          npx cap add android

      - name: Generate Android app icon
        run: |
          npx capacitor-assets generate --android

      - name: Synchronize Android project
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Tech-Room-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
