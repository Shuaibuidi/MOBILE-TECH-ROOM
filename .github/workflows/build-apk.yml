name: Build Mobile Tech Room APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Mobile_Tech_Room_icon.png'
      - '.github/workflows/build-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Mobile_Tech_Room_icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor, native printer and build tools
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capgo/capacitor-printer@7 esbuild@0.25
          npm install --save-dev @capacitor/cli@7 @capacitor/assets

      - name: Prepare app and bundle native printer
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp Mobile_Tech_Room_icon.png resources/icon.png
          node <<'NODE'
          const fs = require('fs');
          const file = 'www/index.html';
          let html = fs.readFileSync(file, 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('Could not find the app module script in index.html');
          fs.writeFileSync('www/app.js', 'window.__MTR_MODULE_STARTED__ = true;\n' + match[1]);
          const diagnostic = `<script>
          window.__MTR_MODULE_STARTED__ = false;
          window.addEventListener('error', function(e) {
            const detail = e.message || (e.target && e.target.src) || 'Unknown startup error';
            const box = document.getElementById('message');
            if (box) box.textContent = 'APK startup error: ' + detail;
          }, true);
          window.addEventListener('unhandledrejection', function(e) {
            const box = document.getElementById('message');
            if (box) box.textContent = 'APK startup error: ' + String(e.reason && (e.reason.message || e.reason));
          });
          setTimeout(function() {
            if (!window.__MTR_MODULE_STARTED__) {
              const box = document.getElementById('message');
              if (box) box.textContent = 'APK startup check: the app JavaScript did not start. Please share this screen with support.';
            }
          }, 7000);
          <\/script>`;
          html = html.replace(match[0], diagnostic + '<script type="module" src="./app.bundle.js"></script>');
          fs.writeFileSync(file, html);
          NODE
          npx esbuild www/app.js --bundle --format=esm --platform=browser --target=es2020 '--external:https://*' --outfile=www/app.bundle.js
          rm www/app.js

      - name: Create Android project
        run: |
          npx cap init "Mobile Tech Room" "com.shuaibuidi.mobiletechroom" --web-dir www
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'capacitor.config.json';
          if (!fs.existsSync(configPath)) {
            throw new Error('Capacitor JSON configuration was not created.');
          }
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.server = {
            ...(config.server || {}),
            hostname: 'shuaibuidi.github.io',
            androidScheme: 'https'
          };
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          console.log('Configured Android WebView origin: https://shuaibuidi.github.io');
          NODE
          npx cap add android

      - name: Generate Android app icon
        run: npx capacitor-assets generate --android

      - name: Synchronize native plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Tech-Room-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
