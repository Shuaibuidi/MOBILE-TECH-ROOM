name: Build Mobile Tech Room Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Mobile_Tech_Room_icon.png'
      - '.github/workflows/build-android.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Mobile_Tech_Room_icon.png'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor, native printer and build tools
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capgo/capacitor-printer@7 esbuild@0.25
          npm install --save-dev @capacitor/cli@7 @capacitor/assets

      - name: Prepare app and bundle native printer
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp offline-sw.js www/offline-sw.js
          cp Mobile_Tech_Room_icon.png resources/icon.png
          node <<'NODE'
          const fs = require('fs');
          const file = 'www/index.html';
          let html = fs.readFileSync(file, 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('Could not find the app module script in index.html');
          fs.writeFileSync('www/app.js', match[1]);
          html = html.replace(match[0], '<script type="module" src="./app.bundle.js"></script>');
          fs.writeFileSync(file, html);
          NODE
          npx esbuild www/app.js --bundle --format=esm --platform=browser --target=es2020 '--external:https://*' --outfile=www/app.bundle.js
          rm www/app.js

      - name: Create Android project using the existing app identity
        run: |
          if [ -f capacitor.config.ts ]; then mv capacitor.config.ts capacitor.config.ts.source; fi
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "mw.siatech.mobiletechroom",
            "appName": "Mobile Tech Room",
            "webDir": "www"
          }
          JSON
          npx cap add android

      - name: Generate Android app icon
        run: |
          mkdir -p assets
          cp Mobile_Tech_Room_icon.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Synchronize native plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Tech-Room-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
