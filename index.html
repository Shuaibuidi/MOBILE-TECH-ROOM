<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c32">
<title>Mobile Tech Room</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101c32;color:#fff;min-height:100vh}
header{padding:22px 18px;text-align:center;background:#172943;border-bottom:1px solid #30445f}
header h1{margin:0;color:#45d6c5;font-size:25px}
header p{color:#bdc9d9;margin:8px 0 0;font-size:13px}
main{width:92%;max-width:440px;margin:35px auto}
.panel{background:#192d49;padding:24px;border-radius:16px;border:1px solid #30445f}
h2{margin-top:0;text-align:center}
p.info{color:#bdc9d9;text-align:center;font-size:14px;line-height:1.5}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #405675;border-radius:9px;background:#101c32;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#45d6c5;color:#102239;font-weight:bold;font-size:15px}
button.secondary{background:#30445f;color:white}
button:disabled{opacity:.5}
.small{text-align:center;color:#bdc9d9;font-size:13px;margin-top:18px}
a{color:#45d6c5;cursor:pointer}
#message{padding:10px;text-align:center;font-size:14px;line-height:1.5}
.hidden{display:none}
footer{text-align:center;color:#8496ad;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>Mobile Tech Room</h1>
<p>Learn. Repair. Innovate.</p>
</header>

<main>
<section class="panel" id="authPanel">
<h2 id="formTitle">Student Login</h2>
<p class="info" id="formInfo">Sign in to access your learning account.</p>

<div id="nameField" class="hidden">
<input id="fullName" type="text" placeholder="Full name">
</div>

<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button id="mainButton">Login</button>
<button id="resetButton" class="secondary">Forgot Password?</button>

<p class="small" id="switchText">
Don't have an account? <a id="switchButton">Register here</a>
</p>
<div id="message"></div>
</section>

<section class="panel hidden" id="statusPanel">
<h2>Welcome to Mobile Tech Room</h2>
<p class="info" id="welcomeText"></p>
<button id="logoutButton">Logout</button>
</section>
</main>

<footer>Mobile Tech Room · Learn mobile technology skills</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendPasswordResetEmail,
 onAuthStateChanged,
 signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 getDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAFP-RfZWPKPcHU9NqtTzX1b8HvVVzkb3Y",
 authDomain: "mobile-tech-room.firebaseapp.com",
 projectId: "mobile-tech-room",
 storageBucket: "mobile-tech-room.firebasestorage.app",
 messagingSenderId: "620229324084",
 appId: "1:620229324084:web:6bbd02c0c58a2547dfc961",
 measurementId: "G-WY4T9JMB97"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let registerMode = false;

const $ = id => document.getElementById(id);
const message = text => $("message").textContent = text;

function showRegister(){
 registerMode = !registerMode;
 $("nameField").classList.toggle("hidden",!registerMode);
 $("formTitle").textContent = registerMode ? "Create Student Account" : "Student Login";
 $("formInfo").textContent = registerMode
  ? "Register to request access to Mobile Tech Room."
  : "Sign in to access your learning account.";
 $("mainButton").textContent = registerMode ? "Register Account" : "Login";
 $("resetButton").classList.toggle("hidden",registerMode);
 $("switchText").innerHTML = registerMode
  ? 'Already registered? <a id="switchButton">Login here</a>'
  : 'Don\'t have an account? <a id="switchButton">Register here</a>';
 $("switchButton").addEventListener("click",showRegister);
 message("");
}

$("switchButton").addEventListener("click",showRegister);

$("mainButton").addEventListener("click",async()=>{
 const email = $("email").value.trim();
 const password = $("password").value;
 const name = $("fullName").value.trim();

 if(!email || !password){
  message("Please enter your email and password.");
  return;
 }
 if(registerMode && !name){
  message("Please enter your full name.");
  return;
 }
 if(password.length < 6){
  message("Password must contain at least 6 characters.");
  return;
 }

 $("mainButton").disabled = true;
 message("Please wait...");

 try{
  if(registerMode){
   const result = await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(result.user,{displayName:name});

   await setDoc(doc(db,"users",result.user.uid),{
    fullName:name,
    email:email,
    role:"student",
    status:"pending",
    createdAt:serverTimestamp()
   });

   message("Registration submitted. Your account is waiting for administrator approval.");
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(error){
  const errors = {
   "auth/email-already-in-use":"This email is already registered.",
   "auth/invalid-email":"Please enter a valid email address.",
   "auth/weak-password":"Choose a stronger password.",
   "auth/invalid-credential":"Incorrect email or password.",
   "permission-denied":"Database permissions are not ready yet. Please contact the administrator."
  };
  message(errors[error.code] || error.message);
 }finally{
  $("mainButton").disabled = false;
 }
});

$("resetButton").addEventListener("click",async()=>{
 const email = $("email").value.trim();
 if(!email){message("Enter your email address first.");return;}
 try{
  await sendPasswordResetEmail(auth,email);
  message("Password reset email sent. Check your inbox.");
 }catch(error){message(error.message);}
});

$("logoutButton").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,async user=>{
 if(!user){
  $("authPanel").classList.remove("hidden");
  $("statusPanel").classList.add("hidden");
  return;
 }

 $("authPanel").classList.add("hidden");
 $("statusPanel").classList.remove("hidden");
 $("welcomeText").textContent = "Checking your account status...";

 try{
  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){
   $("welcomeText").textContent = "Your account profile could not be found. Please contact the administrator.";
   return;
  }

  const data = snap.data();

  if(data.status === "approved"){
   $("welcomeText").textContent = "Your account is approved. The learning centre will be available here as we build the next stage.";
  }else if(data.status === "blocked"){
   $("welcomeText").textContent = "Your account has been blocked. Please contact the administrator.";
  }else{
   $("welcomeText").textContent = "Your registration is awaiting administrator approval. Please check again later.";
  }
 }catch(error){
  $("welcomeText").textContent = "Could not check your account status. Database permissions may need configuration.";
 }
});
</script>
</body>
</html>
