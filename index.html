<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c32">
<title>Mobile Tech Room</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101c32;color:#fff;font-family:Arial,sans-serif}
header{background:#172943;padding:17px;text-align:center;border-bottom:1px solid #30445f}
header h1{margin:0;color:#45d6c5;font-size:23px}
header p{margin:6px 0 0;color:#b9c8d9;font-size:13px}
main{max-width:950px;margin:auto;padding:16px}
.panel{background:#192d49;border:1px solid #30445f;border-radius:13px;padding:17px;margin-bottom:15px}
h2,h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#101c32;color:white;border:1px solid #405675;border-radius:8px;font-size:15px}
textarea{min-height:100px;resize:vertical}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.editor-toolbar select,.editor-toolbar input{width:auto;margin:0;min-width:110px}
.editor-toolbar input[type=color]{width:48px;height:42px;padding:4px}
.lesson-editor{min-height:180px;padding:14px;background:#fff;color:#202938;border:2px solid #45d6c5;border-radius:9px;outline:none;line-height:1.65;overflow-wrap:anywhere}
.lesson-editor:empty:before{content:attr(data-placeholder);color:#778399}
.lesson-editor h1,.lesson-editor h2,.lesson-editor h3{margin:12px 0;color:#176b9a}
.lesson-editor blockquote{border-left:4px solid #45d6c5;padding:8px 14px;margin:10px 0;background:#eef8f7;color:#34445a}
.lesson-body{line-height:1.7;overflow-wrap:anywhere}.lesson-body h1,.lesson-body h2,.lesson-body h3{margin:14px 0 8px}.lesson-body blockquote{border-left:4px solid #45d6c5;padding:8px 14px;background:#203954;margin:12px 0}
button{padding:11px 15px;border:0;border-radius:8px;background:#45d6c5;color:#102239;font-weight:bold;margin:4px 3px;cursor:pointer}
button.secondary{background:#30445f;color:white}
button.danger{background:#a83d4c;color:white}
button:disabled{opacity:.5}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav button{flex:1;min-width:105px}
nav button.active{background:#fff;color:#172943}
.card{background:#203954;border:1px solid #405675;border-radius:10px;padding:14px;margin:10px 0}
.muted{color:#b9c8d9;font-size:13px;line-height:1.5}
.tag{display:inline-block;padding:5px 8px;border-radius:6px;background:#30445f;color:#c8f5ed;font-size:12px;margin:3px}
.success{color:#45d6c5}
.warning{color:#ffd477}
.error{color:#ff9b9b}
.hidden{display:none!important}
#message{padding:10px;text-align:center;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:4px}
a{color:#45d6c5;overflow-wrap:anywhere}
footer{text-align:center;color:#8193aa;padding:25px;font-size:12px}
hr{border:0;border-top:1px solid #405675;margin:15px 0}
</style>
</head>
<body>

<header>
<h1>Mobile Tech Room</h1>
<p>Learn. Repair. Innovate.</p>
</header>

<main>
<section id="authPanel" class="panel">
<h2 id="authTitle">Student Login</h2>
<p class="muted" id="authDescription">Sign in to your learning account.</p>
<div id="registerFields" class="hidden">
<input id="registerName" placeholder="Full name">
</div>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<button id="authButton">Login</button>
<button id="forgotButton" class="secondary">Forgot Password?</button>
<p class="muted" id="switchText">No account? <a href="#" id="switchButton">Register here</a></p>
<div id="message"></div>
</section>

<section id="appPanel" class="hidden">
<div class="panel">
<h2 id="welcomeTitle">Welcome</h2>
<p class="muted" id="accountInfo"></p>
<button id="logoutButton" class="secondary">Logout</button>
</div>

<nav id="navigation"></nav>
<div id="page"></div>
<div id="appMessage"></div>
</section>
</main>

<footer>Mobile Tech Room · Learn mobile technology skills</footer>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,sendPasswordResetEmail,
onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,doc,getDoc,setDoc,collection,
getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp,
query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAFP-RfZWPKPcHU9NqtTzX1b8HvVVzkb3Y",
authDomain:"mobile-tech-room.firebaseapp.com",
projectId:"mobile-tech-room",
storageBucket:"mobile-tech-room.firebasestorage.app",
messagingSenderId:"620229324084",
appId:"1:620229324084:web:6bbd02c0c58a2547dfc961",
measurementId:"G-WY4T9JMB97"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let profile=null;
let registerMode=false;
let currentTab="dashboard";
let selectedCourse=null;
let courses=[];
let users=[];

const $=id=>document.getElementById(id);
const page=$("page");

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function formatLessonContent(value){
  const raw=String(value||"");
  // Preserve older plain-text lessons while safely rendering editor formatting.
  if(!/[<](p|div|h1|h2|h3|strong|b|em|i|u|blockquote|ul|ol|li|span)(\s|>)/i.test(raw)) return safe(raw).replace(/\n/g,"<br>");
  const doc=new DOMParser().parseFromString(raw,"text/html");
  const allowed=new Set(["P","DIV","H1","H2","H3","STRONG","B","EM","I","U","BLOCKQUOTE","UL","OL","LI","BR","SPAN"]);
  function clean(node){
    let out="";
    for(const child of node.childNodes){
      if(child.nodeType===Node.TEXT_NODE){out+=safe(child.textContent);continue;}
      if(child.nodeType!==Node.ELEMENT_NODE)continue;
      const tag=child.tagName;
      if(tag==="FONT"){
        const color=child.getAttribute("color")||"";
        const style=/^#[0-9a-f]{6}$/i.test(color)?` style="color:${color}"`:"";
        out+=`<span${style}>${clean(child)}</span>`;
        continue;
      }
      if(!allowed.has(tag)){out+=clean(child);continue;}
      let attrs="";
      if(tag==="SPAN" && /^#[0-9a-f]{6}$/i.test(child.style.color||"")) attrs=` style="color:${child.style.color}"`;
      out+=`<${tag.toLowerCase()}${attrs}>${clean(child)}</${tag.toLowerCase()}>`;
    }
    return out;
  }
  return clean(doc.body);
}

function appMessage(text,type="success"){
$("appMessage").innerHTML=`<p class="${type}">${safe(text)}</p>`;
}

function isAdmin(){return profile?.role==="admin"&&profile?.status==="approved"}
function isInstructor(){return profile?.role==="instructor"&&profile?.status==="approved"}
function isStaff(){return isAdmin()||isInstructor()}
function isStudent(){return profile?.role==="student"&&profile?.status==="approved"}

function authMessage(text){$("message").textContent=text}

function switchAuth(){
registerMode=!registerMode;
$("registerFields").classList.toggle("hidden",!registerMode);
$("authTitle").textContent=registerMode?"Create Student Account":"Student Login";
$("authDescription").textContent=registerMode?
"Register to request access to Mobile Tech Room.":
"Sign in to your learning account.";
$("authButton").textContent=registerMode?"Register Account":"Login";
$("forgotButton").classList.toggle("hidden",registerMode);
$("switchText").innerHTML=registerMode?
'Already registered? <a href="#" id="switchButton">Login here</a>':
'No account? <a href="#" id="switchButton">Register here</a>';
authMessage("");
}

$("switchButton").onclick=e=>{e.preventDefault();switchAuth()};

$("authButton").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;
const name=$("registerName").value.trim();

if(!email||!password){authMessage("Enter your email and password.");return}
if(password.length<6){authMessage("Password must have at least 6 characters.");return}
if(registerMode&&!name){authMessage("Enter your full name.");return}

$("authButton").disabled=true;
authMessage("Please wait...");

try{
if(registerMode){
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
await setDoc(doc(db,"users",result.user.uid),{
fullName:name,email:email,role:"student",
status:"pending",createdAt:serverTimestamp()
});
authMessage("Registration successful. Your account is waiting for approval.");
}else{
await signInWithEmailAndPassword(auth,email,password);
}
}catch(error){
const errors={
"auth/email-already-in-use":"This email is already registered.",
"auth/invalid-email":"Invalid email address.",
"auth/invalid-credential":"Incorrect email or password.",
"permission-denied":"Firebase permissions need checking."
};
authMessage(errors[error.code]||error.message);
}finally{$("authButton").disabled=false}
};

$("forgotButton").onclick=async()=>{
const email=$("email").value.trim();
if(!email){authMessage("Enter your email address first.");return}
try{
await sendPasswordResetEmail(auth,email);
authMessage("Password reset email sent. Check your inbox.");
}catch(e){authMessage(e.message)}
};

$("logoutButton").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
currentUser=user;
if(!user){
profile=null;
$("authPanel").classList.remove("hidden");
$("appPanel").classList.add("hidden");
return;
}

try{
const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()){
await signOut(auth);
authMessage("Account profile not found.");
return;
}
profile=snap.data();

if(profile.status==="blocked"){
await signOut(auth);
authMessage("Your account has been blocked. Contact the administrator.");
return;
}

$("authPanel").classList.add("hidden");
$("appPanel").classList.remove("hidden");
$("welcomeTitle").textContent="Welcome, "+(profile.fullName||user.email);
$("accountInfo").textContent=
(profile.role||"student").toUpperCase()+" · "+(profile.status||"pending").toUpperCase();

if(profile.status!=="approved"){
page.innerHTML=`<div class="panel">
<h2>Account Pending Approval</h2>
<p>Your registration is waiting for administrator approval.</p>
<p class="muted">Please return later or contact the administrator.</p>
</div>`;
$("navigation").innerHTML="";
return;
}
buildNavigation();
await showTab("dashboard");
}catch(e){
page.innerHTML=`<div class="panel">Unable to load account: ${safe(e.message)}</div>`;
}
});

function buildNavigation(){
let tabs=[];
if(isAdmin())tabs=["dashboard","students","courses","instructors"];
else if(isInstructor())tabs=["dashboard","courses"];
else if(isStudent())tabs=["dashboard","courses"];

$("navigation").innerHTML=tabs.map(t=>
`<button class="${currentTab===t?"active":"secondary"}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`
).join("");
}

$("navigation").onclick=e=>{
const b=e.target.closest("[data-tab]");
if(b)showTab(b.dataset.tab);
};

async function showTab(tab){
currentTab=tab;
buildNavigation();
$("appMessage").innerHTML="";
selectedCourse=null;

if(tab==="dashboard")renderDashboard();
if(tab==="courses")await renderCourses();
if(tab==="students"&&isAdmin())await renderUsers("student");
if(tab==="instructors"&&isAdmin())await renderUsers("instructor");
}

function renderDashboard(){
page.innerHTML=`
<div class="panel">
<h2>Learning Dashboard</h2>
<p>Welcome to Mobile Tech Room.</p>
<p class="muted">Your mobile technology learning centre.</p>
</div>
<div class="panel">
<h3>Your Account</h3>
<p>Name: ${safe(profile.fullName)}</p>
<p>Email: ${safe(profile.email)}</p>
<p>Role: <span class="tag">${safe(profile.role)}</span></p>
<p>Status: <span class="tag">${safe(profile.status)}</span></p>
</div>
${isAdmin()?`
<div class="panel">
<h3>Owner Control Centre</h3>
<p>You have full administrative access.</p>
<p class="muted">Use Students to approve learners and Instructors to manage teaching staff.</p>
</div>`:""}
${isInstructor()?`
<div class="panel">
<h3>Instructor Area</h3>
<p>You can create courses and manage lessons.</p>
</div>`:""}
`;
}


async function loadCourses(){
  let q;

  if(isAdmin()){
    q=collection(db,"courses");
  }else if(isInstructor()){
    q=query(
      collection(db,"courses"),
      where("createdBy","==",currentUser.uid)
    );
  }else{
    q=query(
      collection(db,"courses"),
      where("status","==","published")
    );
  }

  const snap=await getDocs(q);
  courses=snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function renderCourses(){
page.innerHTML="<div class='panel'>Loading courses...</div>";
try{
await loadCourses();
let html=`<div class="panel"><h2>Courses</h2>
<p class="muted">Explore mobile software and phone technician training.</p>`;

if(isStaff()){
html+=`
<h3>Create New Course</h3>
<form id="courseForm">
<input id="courseTitle" placeholder="Course title" required>
<input id="courseCategory" placeholder="Category (e.g. Android, iPhone, Flashing)" required>
<textarea id="courseDescription" placeholder="Course description" required></textarea>
<select id="courseAccess">
<option value="free">Free Course</option>
<option value="paid">Paid Course</option>
</select>
<input id="coursePrice" type="number" min="0" placeholder="Course price (optional)">
<select id="courseStatus">
<option value="draft">Save as Draft</option>
<option value="published">Publish Course</option>
</select>
<button type="submit">Create Course</button>
</form><hr>`;
}
html+="</div>";

if(!courses.length){
html+=`<div class="panel"><p>No courses available yet.</p></div>`;
}

for(const c of courses){
html+=`
<div class="card">
<h3>${safe(c.title)}</h3>
<span class="tag">${safe(c.category)}</span>
<span class="tag">${safe(c.accessType||"free")}</span>
<span class="tag">${safe(c.status||"draft")}</span>
<p>${safe(c.description)}</p>
${c.accessType==="paid"?`<p>Price: ${safe(c.price||0)}</p>`:""}
<p class="muted">Course ID: ${safe(c.id)}</p>
<div class="actions">
<button data-action="open-course" data-id="${safe(c.id)}">Open Lessons</button>
${isAdmin()?`
<button class="secondary" data-action="edit-course" data-id="${safe(c.id)}">Edit</button>
<button class="danger" data-action="delete-course" data-id="${safe(c.id)}">Delete</button>`:""}
</div>
</div>`;
}
page.innerHTML=html;

const form=$("courseForm");
if(form)form.onsubmit=createCourse;
}catch(e){
page.innerHTML=`<div class="panel error">Could not load courses: ${safe(e.message)}</div>`;
}
}

async function createCourse(e){
e.preventDefault();
try{
await addDoc(collection(db,"courses"),{
title:$("courseTitle").value.trim(),
category:$("courseCategory").value.trim(),
description:$("courseDescription").value.trim(),
accessType:$("courseAccess").value,
price:Number($("coursePrice").value||0),
status:$("courseStatus").value,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
});
appMessage("Course created successfully.");
await renderCourses();
}catch(e){appMessage("Could not create course: "+e.message,"error")}
}

async function openCourse(id){
selectedCourse=courses.find(c=>c.id===id);
if(!selectedCourse){appMessage("Course not found.","error");return}

if(isStudent()){
if(selectedCourse.accessType==="paid"){
const enrollment=await getDoc(doc(db,"users",currentUser.uid,"enrollments",id));
if(!enrollment.exists()||enrollment.data().status!=="active"){
page.innerHTML=`<div class="panel">
<h2>${safe(selectedCourse.title)}</h2>
<p>This is a paid course. You do not currently have access.</p>
<p class="muted">Contact the administrator to arrange payment and course access.</p>
<button class="secondary" data-action="back-courses">Back to Courses</button>
</div>`;
return;
}
}
}

await renderLessons(id);
}

async function renderLessons(courseId){
page.innerHTML="<div class='panel'>Loading lessons...</div>";
try{
const snap=await getDocs(collection(db,"courses",courseId,"lessons"));
const lessons=snap.docs.map(d=>({id:d.id,...d.data()}));
let html=`
<div class="panel">
<button class="secondary" data-action="back-courses">Back to Courses</button>
<h2>${safe(selectedCourse.title)}</h2>
<p>${safe(selectedCourse.description)}</p>
</div>`;

if(isStaff()){
html+=`
<div class="panel">
<h3>Add New Lesson</h3>
<form id="lessonForm">
<input id="lessonTitle" placeholder="Lesson title" required>
<select id="lessonType">
<option value="written">Written Lesson</option>
<option value="video">Video Link</option>
<option value="audio">Audio Link</option>
<option value="pdf">PDF Link</option>
<option value="image">Image Link</option>
</select>
<label for="lessonStyle" class="muted">Choose text style</label>
<div class="editor-toolbar">
<select id="lessonStyle" aria-label="Text style">
<option value="P">Normal text</option><option value="H1">Heading 1</option>
<option value="H2">Heading 2</option><option value="H3">Heading 3</option>
<option value="BLOCKQUOTE">Quote</option>
</select>
<button type="button" class="secondary" data-editor="bold"><b>B</b></button>
<button type="button" class="secondary" data-editor="italic"><i>I</i></button>
<button type="button" class="secondary" data-editor="underline"><u>U</u></button>
<label class="muted" for="lessonTextColor">Text color</label>
<input id="lessonTextColor" type="color" value="#202938" aria-label="Text color">
</div>
<div id="lessonContent" class="lesson-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write your lesson here..."></div>
<input id="lessonUrl" type="url" placeholder="Optional external media URL (https://...)">
<button type="submit">Save Lesson</button>
</form>
</div>`;
}

if(!lessons.length)html+=`<div class="panel">No lessons have been added yet.</div>`;

lessons.forEach((l,i)=>{
html+=`
<div class="card">
<h3>${i+1}. ${safe(l.title)}</h3>
<span class="tag">${safe(l.type||"written")}</span>
<div class="lesson-body">${formatLessonContent(l.content||"")}</div>
${l.mediaUrl?`<p><a href="${safe(l.mediaUrl)}" target="_blank" rel="noopener noreferrer">Open learning material</a></p>`:""}
${isAdmin()?`
<div class="actions">
<button class="secondary" data-action="edit-lesson" data-id="${safe(l.id)}">Edit</button>
<button class="danger" data-action="delete-lesson" data-id="${safe(l.id)}">Delete</button>
</div>`:""}
</div>`;
});

page.innerHTML=html;
const editor=$("lessonContent");
const styleSelect=$("lessonStyle");
const textColor=$("lessonTextColor");
if(editor){
  styleSelect.onchange=()=>{editor.focus();document.execCommand("formatBlock",false,styleSelect.value);};
  document.querySelectorAll("[data-editor]").forEach(btn=>btn.onclick=()=>{editor.focus();document.execCommand(btn.dataset.editor,false,null);});
  textColor.oninput=()=>{editor.focus();document.execCommand("foreColor",false,textColor.value);};
}
const form=$("lessonForm");
if(form)form.onsubmit=async e=>{
e.preventDefault();
try{
const url=$("lessonUrl").value.trim();
if(url&&!/^https:\/\/.+/i.test(url)){
appMessage("Please enter a valid HTTPS media link.","error");return;
}
await addDoc(collection(db,"courses",courseId,"lessons"),{
title:$("lessonTitle").value.trim(),
type:$("lessonType").value,
content:$("lessonContent").innerHTML.trim(),
mediaUrl:url,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
});
appMessage("Lesson saved successfully.");
await renderLessons(courseId);
}catch(e){appMessage("Could not save lesson: "+e.message,"error")}
};
}catch(e){
page.innerHTML=`<div class="panel error">Could not load lessons: ${safe(e.message)}</div>`;
}
}

async function editCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can edit courses.","error");
return;
}
const c=courses.find(x=>x.id===id);
if(!c)return;
const title=prompt("Course title:",c.title);
if(title===null)return;
const description=prompt("Course description:",c.description||"");
if(description===null)return;
try{
await updateDoc(doc(db,"courses",id),{
title:title.trim(),description:description.trim()
});
appMessage("Course updated.");
await renderCourses();
}catch(e){appMessage(e.message,"error")}
}

async function deleteCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can delete courses.","error");
return;
}
if(!confirm("Delete this course and its lessons?"))return;
try{
const lessons=await getDocs(collection(db,"courses",id,"lessons"));
for(const l of lessons.docs){
await deleteDoc(doc(db,"courses",id,"lessons",l.id));
}
await deleteDoc(doc(db,"courses",id));
appMessage("Course deleted.");
await renderCourses();
}catch(e){appMessage("Could not delete course: "+e.message,"error")}
}

async function editLesson(id){
if(!isAdmin()){
appMessage("Only the administrator can edit lessons.","error");
return;
}
const courseId=selectedCourse.id;
const ref=doc(db,"courses",courseId,"lessons",id);
const snap=await getDoc(ref);
if(!snap.exists())return;
const l=snap.data();
const title=prompt("Lesson title:",l.title);
if(title===null)return;
const content=prompt("Lesson content:",l.content||"");
if(content===null)return;
try{
await updateDoc(ref,{title:title.trim(),content:content.trim()});
appMessage("Lesson updated.");
await renderLessons(courseId);
}catch(e){appMessage(e.message,"error")}
}

async function deleteLesson(id){
if(!isAdmin()){
appMessage("Only the administrator can delete lessons.","error");
return;
}
if(!confirm("Delete this lesson?"))return;
try{
await deleteDoc(doc(db,"courses",selectedCourse.id,"lessons",id));
appMessage("Lesson deleted.");
await renderLessons(selectedCourse.id);
}catch(e){appMessage(e.message,"error")}
}

async function renderUsers(role){
page.innerHTML="<div class='panel'>Loading accounts...</div>";
try{
const snap=await getDocs(collection(db,"users"));
users=snap.docs.map(d=>({id:d.id,...d.data()}))
.filter(u=>u.role===role);
let html=`<div class="panel">
<h2>${role==="student"?"Student Management":"Instructor Management"}</h2>
<p class="muted">Manage account permissions and access.</p>
</div>`;

if(!users.length)html+=`<div class="panel">No ${role} accounts found.</div>`;

users.forEach(u=>{
html+=`
<div class="card">
<h3>${safe(u.fullName||"Unnamed account")}</h3>
<p>${safe(u.email)}</p>
<span class="tag">${safe(u.role)}</span>
<span class="tag">${safe(u.status)}</span>
<div class="actions">
${role==="student"&&u.status!=="approved"?
`<button data-action="approve-user" data-id="${safe(u.id)}">Approve</button>`:""}
${u.status!=="blocked"?
`<button class="danger" data-action="block-user" data-id="${safe(u.id)}">Block</button>`:
`<button data-action="unblock-user" data-id="${safe(u.id)}">Restore</button>`}
${role==="student"&&u.status==="approved"?
`<button class="secondary" data-action="manage-enrollments" data-id="${safe(u.id)}">Manage Course Access</button>
<button class="secondary" data-action="promote-user" data-id="${safe(u.id)}">Make Instructor</button>`:""}
${role==="instructor"?
`<button class="secondary" data-action="demote-user" data-id="${safe(u.id)}">Return to Student</button>`:""}
</div>
</div>`;
});
page.innerHTML=html;
}catch(e){
page.innerHTML=`<div class="panel error">Could not load accounts: ${safe(e.message)}</div>`;
}
}

async function manageStudentEnrollments(studentId){
  if(!isAdmin())return;
  const student=users.find(u=>u.id===studentId);
  if(!student){appMessage("Student account not found.","error");return;}
  page.innerHTML="<div class='panel'>Loading paid course access...</div>";
  try{
    const courseSnap=await getDocs(collection(db,"courses"));
    const paidCourses=courseSnap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(c=>c.accessType==="paid"&&c.status==="published");
    const enrollmentSnap=await getDocs(collection(db,"users",studentId,"enrollments"));
    const enrollmentMap=new Map(enrollmentSnap.docs.map(d=>[d.id,d.data()]));
    let html=`<div class="panel">
      <button class="secondary" data-action="back-students">Back to Students</button>
      <h2>Paid Course Access</h2>
      <p><strong>${safe(student.fullName||"Student")}</strong></p>
      <p class="muted">${safe(student.email||"")}</p>
      <p class="muted">Grant or revoke access to published paid courses.</p>
    </div>`;
    if(!paidCourses.length)html+=`<div class="panel">There are no published paid courses.</div>`;
    for(const course of paidCourses){
      const active=enrollmentMap.get(course.id)?.status==="active";
      html+=`<div class="card">
        <h3>${safe(course.title)}</h3>
        <p>Price: ${safe(course.price??0)}</p>
        <span class="tag">${active?"Access active":"No active access"}</span>
        <div class="actions">${active
          ? `<button class="danger" data-action="revoke-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Revoke Access</button>`
          : `<button data-action="grant-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Grant Access</button>`}
        </div>
      </div>`;
    }
    page.innerHTML=html;
  }catch(e){page.innerHTML=`<div class="panel error">Could not load course access: ${safe(e.message)}</div>`;}
}

async function grantEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Grant this student access to the selected paid course?"))return;
  try{
    const courseSnap=await getDoc(doc(db,"courses",courseId));
    if(!courseSnap.exists())throw new Error("Course not found.");
    const course=courseSnap.data();
    if(course.accessType!=="paid"||course.status!=="published")
      throw new Error("Only published paid courses can be enrolled.");
    await setDoc(doc(db,"users",studentId,"enrollments",courseId),{
      status:"active",courseId:courseId,courseTitle:course.title||"",
      grantedBy:currentUser.uid,grantedAt:serverTimestamp()
    });
    appMessage("Paid course access granted.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not grant access: "+e.message,"error");}
}

async function revokeEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Revoke this student's access to the course?"))return;
  try{
    await deleteDoc(doc(db,"users",studentId,"enrollments",courseId));
    appMessage("Course access revoked.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not revoke access: "+e.message,"error");}
}

async function changeUser(id,changes,success){
try{
await updateDoc(doc(db,"users",id),changes);
appMessage(success);
await renderUsers(currentTab==="students"?"student":"instructor");
}catch(e){appMessage("Could not update account: "+e.message,"error")}
}

document.addEventListener("click",async e=>{
const b=e.target.closest("[data-action]");
if(!b)return;
const action=b.dataset.action;
const id=b.dataset.id;

try{
if(action==="open-course")await openCourse(id);
    if(action==="manage-enrollments"&&isAdmin())await manageStudentEnrollments(id);
    if(action==="back-students"&&isAdmin())await renderUsers("student");
    if(action==="grant-enrollment"&&isAdmin())await grantEnrollment(b.dataset.student,b.dataset.course);
    if(action==="revoke-enrollment"&&isAdmin())await revokeEnrollment(b.dataset.student,b.dataset.course);
if(action==="back-courses")await renderCourses();
if(action==="edit-course"&&isAdmin())await editCourse(id);
if(action==="delete-course"&&isAdmin())await deleteCourse(id);
if(action==="edit-lesson"&&isAdmin())await editLesson(id);
if(action==="delete-lesson"&&isAdmin())await deleteLesson(id);

if(action==="approve-user"&&isAdmin())
await changeUser(id,{status:"approved"},"Student approved.");

if(action==="block-user"&&isAdmin()){
if(confirm("Block this account?"))
await changeUser(id,{status:"blocked"},"Account blocked.");
}

if(action==="unblock-user"&&isAdmin())
await changeUser(id,{status:"approved"},"Account restored.");

if(action==="promote-user"&&isAdmin()){
if(confirm("Give this account instructor permissions?"))
await changeUser(id,{role:"instructor",status:"approved"},"Instructor permissions granted.");
}

if(action==="demote-user"&&isAdmin()){
if(confirm("Remove instructor permissions?"))
await changeUser(id,{role:"student",status:"approved"},"Instructor permissions removed.");
}
}catch(error){appMessage(error.message,"error")}
});
</script>
</body>
</html>
