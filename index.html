<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c32">
<title>Mobile Tech Room</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101c32;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:1000;background:#172943;padding:23px 17px 17px;text-align:center;border-bottom:1px solid #30445f}
header h1{margin:0;color:#45d6c5;font-size:23px}
header p{margin:6px 0 0;color:#b9c8d9;font-size:13px}
main{max-width:950px;margin:auto;padding:16px}
.panel{background:#192d49;border:1px solid #30445f;border-radius:13px;padding:17px;margin-bottom:15px}
h2,h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#101c32;color:white;border:1px solid #405675;border-radius:8px;font-size:15px}
textarea{min-height:100px;resize:vertical}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.editor-toolbar select,.editor-toolbar input{width:auto;margin:0;min-width:105px;max-width:100%}
.editor-toolbar input[type=color]{width:48px;height:42px;padding:4px}
.editor-toolbar label{font-size:12px}
.lesson-editor [style*="font-family"]{font-family:inherit}
.lesson-body{background:#fff;color:#202938;border-radius:10px;padding:16px;margin-top:12px}
.lesson-body h1{font-size:30px;color:#075985;border-bottom:3px solid #45d6c5;padding-bottom:8px}
.lesson-body h2{font-size:24px;color:#0e7490}
.lesson-body h3{font-size:19px;color:#7c3aed}
.lesson-body ul,.lesson-body ol{padding-left:26px}
@media print{body{background:#fff;color:#111}header{position:static}}
.lesson-editor{min-height:180px;padding:14px;background:#fff;color:#202938;border:2px solid #45d6c5;border-radius:9px;outline:none;line-height:1.65;overflow-wrap:anywhere}
.lesson-editor:empty:before{content:attr(data-placeholder);color:#778399}
.lesson-editor h1,.lesson-editor h2,.lesson-editor h3{margin:12px 0;color:#176b9a}
.lesson-editor blockquote{border-left:4px solid #45d6c5;padding:8px 14px;margin:10px 0;background:#eef8f7;color:#34445a}
.lesson-body{line-height:1.7;overflow-wrap:anywhere}.lesson-body h1,.lesson-body h2,.lesson-body h3{margin:14px 0 8px}.lesson-body blockquote{border-left:4px solid #45d6c5;padding:8px 14px;background:#203954;margin:12px 0}
button{padding:11px 15px;border:0;border-radius:8px;background:#45d6c5;color:#102239;font-weight:bold;margin:4px 3px;cursor:pointer}
button.secondary{background:#30445f;color:white}
button.danger{background:#a83d4c;color:white}
button:disabled{opacity:.5}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav button{flex:1;min-width:105px}
nav button.active{background:#fff;color:#172943}
.card{background:#203954;border:1px solid #405675;border-radius:10px;padding:14px;margin:10px 0}
.muted{color:#b9c8d9;font-size:13px;line-height:1.5}
.tag{display:inline-block;padding:5px 8px;border-radius:6px;background:#30445f;color:#c8f5ed;font-size:12px;margin:3px}
.success{color:#45d6c5}
.warning{color:#ffd477}
.error{color:#ff9b9b}
.hidden{display:none!important}
#message{padding:10px;text-align:center;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:4px}

/* Dashboard refresh */
.dashboard-hero{background:linear-gradient(135deg,#193b59,#126b70);border:1px solid #3b8e91;border-radius:16px;padding:22px;margin-bottom:15px}
.dashboard-hero h2{font-size:clamp(22px,5vw,30px);margin:0 0 8px;color:#fff}
.dashboard-hero p{margin:5px 0;color:#d8f5f1;line-height:1.55}
.dashboard-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0 16px}
.dashboard-stat{background:#203954;border:1px solid #405675;border-radius:12px;padding:15px;min-width:0}
.dashboard-stat strong{display:block;color:#45d6c5;font-size:27px;line-height:1.2;margin-bottom:6px}
.dashboard-stat span{font-size:12px;color:#c3d2e2;line-height:1.4}
.dashboard-section-title{margin:20px 0 10px}
.dashboard-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.dashboard-actions button{margin:0;min-height:48px}
.dashboard-account p{overflow-wrap:anywhere;margin:9px 0}
.dashboard-tip{border-left:4px solid #45d6c5}
@media(max-width:420px){.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-stat{padding:12px}.dashboard-stat strong{font-size:23px}}
a{color:#45d6c5;overflow-wrap:anywhere}
footer{text-align:center;color:#8193aa;padding:25px;font-size:12px}
hr{border:0;border-top:1px solid #405675;margin:15px 0}
.lesson-list{margin:10px 0;padding-left:28px;display:grid;gap:12px}
.lesson-item{background:#203954;border:1px solid #405675;border-radius:12px;padding:14px 14px 14px 18px;min-width:0}
.lesson-item::marker{color:#45d6c5;font-weight:bold}
.lesson-item h3{margin:0 0 10px;font-size:clamp(13px,3.5vw,18px);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.lesson-item .lesson-body{margin:10px 0}
.media-preview{display:block;width:min(100%,260px);height:150px;padding:0;margin:12px 0;background:#101c32;border:1px solid #60758e;border-radius:10px;overflow:hidden}
.media-preview img,.media-preview video{display:block;width:100%;height:100%;object-fit:cover}
.media-preview.video-preview{position:relative}
.media-preview.video-preview:after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#071a2cdd;color:white;font-size:23px;padding-left:3px;pointer-events:none}
.media-lightbox{position:fixed;inset:0;z-index:100000;background:#050b14ee;display:flex;align-items:center;justify-content:center;padding:16px}
.media-lightbox-inner{width:min(100%,1000px);max-height:100%;display:flex;flex-direction:column;gap:10px}
.media-lightbox-content{display:block;max-width:100%;max-height:80vh;width:auto;height:auto;object-fit:contain;margin:auto;border-radius:10px}
.media-lightbox video{width:100%;max-height:80vh;background:#000}
.media-lightbox-title{margin:0;text-align:center;color:white;overflow-wrap:anywhere}
.media-lightbox-close{align-self:flex-end;background:#30445f;color:white}

/* Professional visual refresh */
:root{color-scheme:dark;--bg:#091525;--surface:#12243a;--surface2:#182f49;--line:#294663;--teal:#35d6c0;--blue:#62a9ff;--violet:#a78bfa;--gold:#ffc56b;--text:#f4f7fc;--muted:#afc1d5}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 12% 0%,#173c5b 0,transparent 38%),radial-gradient(ellipse at 100% 20%,#24315b 0,transparent 34%),var(--bg);color:var(--text);line-height:1.55}
header{background:linear-gradient(115deg,#10283fef,#18284aef);border-bottom:1px solid #3a6384;box-shadow:0 8px 28px #02091470;backdrop-filter:blur(14px)}
header h1{color:var(--teal);letter-spacing:.6px;text-shadow:0 0 22px #35d6c044}
header p{color:#c4d6ea;letter-spacing:.5px}
main{padding-top:20px;padding-bottom:30px}
.panel{background:linear-gradient(145deg,#172d46f5,#102239f5);border:1px solid #34516e;border-radius:17px;box-shadow:0 12px 28px #020b1745}
h2{color:#77c7ff}
h3{color:#b7a4ff}
input,textarea,select{background:#0b1a2c;border:1px solid #385675;color:#f5f8ff;border-radius:11px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #35d6c025}
input::placeholder,textarea::placeholder{color:#8298b1}
button{background:linear-gradient(110deg,#35d6c0,#64b8ef);color:#082033;border-radius:11px;box-shadow:0 5px 14px #35a9c02b;transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 18px #35a9c044}
button:active{transform:translateY(0)}
button.secondary{background:linear-gradient(110deg,#385777,#4b6487);color:#f4f8ff;box-shadow:none}
button.danger{background:linear-gradient(110deg,#d94f68,#a83d66);color:white}
nav{padding:7px;background:#0b1b2d;border:1px solid #2b4662;border-radius:14px}
nav button{background:#203c59;color:#d9e8f8;box-shadow:none}
nav button.active{background:linear-gradient(110deg,#35d6c0,#73baff);color:#082033}
.card,.lesson-item,.dashboard-stat{background:linear-gradient(145deg,#1a3551,#142940);border:1px solid #345574;border-radius:14px;box-shadow:0 7px 18px #020b1730}
.lesson-item{border-left:3px solid #42cbbb}
.lesson-item::marker{color:var(--gold)}
.tag{background:#273f60;color:#a9e9e4;border:1px solid #426487;border-radius:20px;padding:5px 10px}
.muted{color:var(--muted)}
.success{color:#55e0b4}.warning{color:#ffd27d}.error{color:#ff879b}
a{color:#73c8ff;text-decoration:none}a:hover{text-decoration:underline;color:#a7e8ff}
.whatsapp-link{display:inline-flex;align-items:center;justify-content:center;margin:10px 4px 10px 0;padding:12px 16px;border-radius:11px;background:linear-gradient(110deg,#25d366,#8be7a5);color:#062b19;font-weight:800;text-decoration:none;box-shadow:0 6px 16px #25d36630}.whatsapp-link:hover{color:#062b19;filter:brightness(1.06);text-decoration:none}
.dashboard-hero{background:linear-gradient(120deg,#123d59,#126b70 52%,#354078);border:1px solid #3b9a9b;box-shadow:0 14px 30px #020b1745}
.dashboard-stat strong{color:#51e0cc}
.dashboard-stat span{color:#c7d8e9}
.dashboard-tip{border-left-color:var(--gold)}
.lesson-editor{border-color:#55cfc2;box-shadow:0 0 0 3px #35d6c015}
.media-preview{border-color:#4c7395;box-shadow:0 8px 18px #020b1745}
.media-lightbox{backdrop-filter:blur(8px)}
#message,#appMessage{color:#eaf3ff}
footer{color:#8fa7c0}
hr{border-top-color:#34516e}
.uppercase-accent{color:#ffc56b!important;font-weight:800;letter-spacing:.045em;text-shadow:0 0 14px #ffc56b24}
@media(max-width:600px){header{padding:20px 14px 16px}header h1{font-size:22px}.panel{padding:14px;border-radius:15px}main{padding:13px}}


/* Student academy experience */
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:15px;margin:14px 0}
.student-course{overflow:hidden;padding:0;background:#fff;color:#243047;border:1px solid #e4e8ef;border-radius:18px;box-shadow:0 10px 28px #0002}
.student-course-cover{height:142px;background:linear-gradient(135deg,#6441a5,#bd74c9);position:relative;overflow:hidden}
.student-course-cover img{width:100%;height:100%;object-fit:cover;display:block}
.student-course-cover .cover-placeholder{height:100%;display:grid;place-items:center;color:white;font-size:42px;background:linear-gradient(135deg,#6844a5,#d17cbb)}
.student-course-info{padding:15px}
.student-course-info h3{color:#292d45;margin:0 0 7px;font-size:17px}
.student-course-info p{color:#697386;font-size:13px;line-height:1.5;min-height:38px}
.student-course-info .tag{background:#f0eafa;color:#6946a0;border:0}
.student-course-info button{width:100%;margin:8px 0 0;background:linear-gradient(110deg,#8055b7,#a56ac5);color:white}
.student-course-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.student-course-heading h2{color:#fff}
.learning-shell{background:#f4f2f8;color:#25263b;border-radius:20px;padding:14px;box-shadow:0 12px 30px #0002}
.learning-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.learning-top h2{color:#29243c;margin:0;font-size:19px}
.learning-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,.8fr);gap:14px}
.learning-main,.learning-playlist{background:#fff;border:1px solid #e6e2ed;border-radius:15px;padding:14px;min-width:0}
.learning-media{width:100%;aspect-ratio:16/9;background:#171527;border-radius:12px;overflow:hidden;display:grid;place-items:center;margin-bottom:14px}
.learning-media video,.learning-media iframe,.learning-media img{width:100%;height:100%;object-fit:contain;border:0}
.learning-media .media-placeholder{color:#fff;text-align:center;padding:20px}
.learning-main h2{color:#4f347b;margin:10px 0}
.learning-main .lesson-body{background:#fff;color:#263244;padding:4px 0}
.learning-main .lesson-body blockquote{background:#f2eef8;color:#34445a}
.learning-progress-track{height:8px;background:#e8e4ef;border-radius:20px;overflow:hidden;margin:9px 0}
.learning-progress-fill{height:100%;background:linear-gradient(90deg,#7952b3,#d18ac6);border-radius:20px}
.learning-playlist h3{color:#4c3474;margin:0 0 10px}
.playlist-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#f7f5fa;color:#33304a;box-shadow:none;border:1px solid #e8e3ef;margin:5px 0;padding:10px;border-radius:10px}
.playlist-item.active{background:#eee5f8;border-color:#9368be;color:#56377f}
.playlist-item .playlist-number{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;background:#e4d8f1;color:#68439b}
.playlist-item small{display:block;color:#777185;font-weight:400}
.learning-controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:15px}
.learning-controls button{flex:1}
.learning-controls .complete-button{background:linear-gradient(110deg,#1aa77a,#54c99c);color:#fff}
.learning-back{background:#4b3b68!important;color:#fff!important}
.student-course-search{background:#fff;color:#25263b;border:1px solid #e5e0ed}
@media(max-width:680px){.learning-layout{grid-template-columns:1fr}.learning-playlist{order:2}.learning-shell{padding:10px}.learning-main,.learning-playlist{padding:11px}.learning-top h2{font-size:16px}}



/* Desktop academy layout */
@media (min-width: 1000px){
  body{min-height:100vh}
  header{padding:20px max(32px,calc((100vw - 1440px)/2));text-align:left;display:flex;align-items:center;justify-content:space-between;min-height:86px}
  header h1{font-size:25px}
  header p{margin:0;font-size:14px}
  main{max-width:1480px;padding:30px 34px 42px}
  #authPanel{max-width:560px;margin:7vh auto;padding:34px}
  #appPanel{display:grid;grid-template-columns:245px minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:26px;align-items:start}
  #appPanel > .panel:first-child{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 25px;margin-bottom:18px}
  #appPanel > .panel:first-child h2{margin:0 0 4px;font-size:23px}
  #appPanel > .panel:first-child p{margin:0}
  #appPanel > .panel:first-child button{min-width:120px}
  #navigation{grid-column:1;grid-row:2/4;position:sticky;top:108px;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:13px;margin:0;min-height:calc(100vh - 160px);border-radius:18px;background:linear-gradient(180deg,#0d2035,#102943);box-shadow:0 12px 30px #02091455}
  #navigation button{width:100%;min-height:48px;text-align:left;padding:13px 16px;margin:0;border-radius:11px;font-size:14px}
  #navigation button::before{content:'›';display:inline-block;margin-right:12px;color:#70e3d4;font-size:20px;line-height:10px;vertical-align:-1px}
  #navigation button.active{box-shadow:0 5px 16px #35d6c033}
  #page{grid-column:2;grid-row:2;min-width:0}
  #appMessage{grid-column:2;grid-row:3;min-width:0}
  .panel{padding:24px;margin-bottom:19px}
  .dashboard-hero{padding:34px 38px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
  .dashboard-hero h2{font-size:34px}
  .dashboard-stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0 24px}
  .dashboard-stat{padding:22px}
  .dashboard-stat strong{font-size:32px}
  .dashboard-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
  .course-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .student-course-cover{height:185px}
  .student-course-info{padding:19px}
  .student-course-info h3{font-size:19px}
  .student-course-info p{font-size:14px}
  .student-course-heading{margin-bottom:16px}
  .student-course-search{max-width:430px}
  .learning-shell{padding:24px;border-radius:22px}
  .learning-top{margin-bottom:20px}
  .learning-top h2{font-size:23px}
  .learning-layout{grid-template-columns:minmax(0,1.9fr) minmax(300px,.85fr);gap:22px;align-items:start}
  .learning-main,.learning-playlist{padding:22px;border-radius:17px}
  .learning-media{margin-bottom:20px}
  .learning-main h2{font-size:25px}
  .learning-main .lesson-body{font-size:16px;line-height:1.8}
  .learning-playlist{position:sticky;top:108px;max-height:calc(100vh - 145px);overflow:auto}
  .playlist-item{padding:13px;min-height:60px}
  .learning-controls{gap:12px}
  .learning-controls button{min-height:46px}
  .lesson-list{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:28px;gap:15px}
  .lesson-item{padding:18px}
  .media-lightbox-inner{width:min(100%,1200px)}
  footer{padding:30px}
}
@media (min-width:1450px){
  main{padding-left:48px;padding-right:48px}
  #appPanel{grid-template-columns:265px minmax(0,1fr);column-gap:32px}
  .course-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .learning-layout{grid-template-columns:minmax(0,2fr) minmax(330px,.82fr)}
}
@media (min-width:681px) and (max-width:999px){
  main{max-width:100%;padding:22px}
  .course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .learning-layout{grid-template-columns:minmax(0,1.4fr) minmax(230px,.9fr)}
}

</style>
</head>
<body>

<header>
<h1>Mobile Tech Room</h1>
<p>Learn. Repair. Innovate.</p>
</header>

<main>
<section id="authPanel" class="panel">
<h2 id="authTitle">Student Login</h2>
<p class="muted" id="authDescription">Sign in to your learning account.</p>
<div id="registerFields" class="hidden">
<input id="registerName" placeholder="Full name">
<input id="registerPhone" type="tel" inputmode="tel" placeholder="Phone number (e.g. +265...)">
</div>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<button id="authButton">Login</button>
<button id="forgotButton" class="secondary">Forgot Password?</button>
<p class="muted" id="switchText">No account? <a href="#" id="switchButton">Register here</a></p>
<div id="message"></div>
</section>

<section id="appPanel" class="hidden">
<div class="panel">
<h2 id="welcomeTitle">Welcome</h2>
<p class="muted" id="accountInfo"></p>
<button id="logoutButton" class="secondary">Logout</button>
</div>

<nav id="navigation"></nav>
<div id="page"></div>
<div id="appMessage"></div>
</section>
</main>

<footer>Mobile Tech Room · Learn mobile technology skills</footer>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

getAuth,createUserWithEmailAndPassword,

} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp,
query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAFP-RfZWPKPcHU9NqtTzX1b8HvVVzkb3Y",
authDomain:"mobile-tech-room.firebaseapp.com",
projectId:"mobile-tech-room",
storageBucket:"mobile-tech-room.firebasestorage.app",
messagingSenderId:"620229324084",
appId:"1:620229324084:web:6bbd02c0c58a2547dfc961",
measurementId:"G-WY4T9JMB97"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let profile=null;
let registerMode=false;
let registrationInProgress=false;
let currentTab="dashboard";

let users=[];

const $=id=>document.getElementById(id);
const page=$("page");

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function formatLessonContent(value){
  const raw=String(value||"");
  if(!/[<](p|div|h1|h2|h3|strong|b|em|i|u|blockquote|ul|ol|li|span|font)(\s|>)/i.test(raw)) return safe(raw).replace(/\n/g,"<br>");
  const doc=new DOMParser().parseFromString(raw,"text/html");
  const allowed=new Set(["P","DIV","H1","H2","H3","STRONG","B","EM","I","U","BLOCKQUOTE","UL","OL","LI","BR","SPAN"]);
  const safeStyle=(el)=>{
    const styles=[];
    const color=el.style?.color||"";
    const bg=el.style?.backgroundColor||"";
    const family=el.style?.fontFamily||"";
    const size=el.style?.fontSize||"";
    const align=el.style?.textAlign||"";
    if(/^(#[0-9a-f]{3,8}|rgb\([\d\s,%.]+\)|[a-z]{3,20})$/i.test(color))styles.push(`color:${color}`);
    if(/^(#[0-9a-f]{3,8}|rgb\([\d\s,%.]+\)|[a-z]{3,20})$/i.test(bg))styles.push(`background-color:${bg}`);
    if(/^[a-z ,'-]{2,60}$/i.test(family))styles.push(`font-family:${family}`);
    if(/^([1-7]\d|[1-5]\d|6\d)px$/.test(size))styles.push(`font-size:${size}`);
    if(["left","right","center","justify"].includes(align))styles.push(`text-align:${align}`);
    return styles.length?` style="${safe(styles.join(";"))}"`:"";
  };
  function clean(node){
    let out="";
    for(const child of node.childNodes){
      if(child.nodeType===Node.TEXT_NODE){out+=safe(child.textContent);continue;}
      if(child.nodeType!==Node.ELEMENT_NODE)continue;
      const tag=child.tagName;
      if(tag==="FONT"){
        const styles=[];
        const color=child.getAttribute("color")||"";
        const face=child.getAttribute("face")||"";
        const sizes={"1":"12px","2":"14px","3":"16px","4":"18px","5":"24px","6":"32px","7":"40px"};
        if(/^#[0-9a-f]{3,8}$/i.test(color))styles.push(`color:${color}`);
        if(/^[a-z ,'-]{2,60}$/i.test(face))styles.push(`font-family:${face}`);
        if(sizes[child.getAttribute("size")])styles.push(`font-size:${sizes[child.getAttribute("size")]}`);
        out+=`<span${styles.length?` style="${safe(styles.join(";"))}"`:""}>${clean(child)}</span>`;
        continue;
      }
      if(!allowed.has(tag)){out+=clean(child);continue;}
      out+=`<${tag.toLowerCase()}${safeStyle(child)}>${clean(child)}</${tag.toLowerCase()}>`;
    }
    return out;
  }
  return clean(doc.body);
}

function isInstructor(){return profile?.role==="instructor"&&profile?.status==="approved"}

function isStudent(){return profile?.role==="student"&&profile?.status==="approved"}

function switchAuth(){
registerMode=!registerMode;
$("registerFields").classList.toggle("hidden",!registerMode);
$("authTitle").textContent=registerMode?"Create Student Account":"Student Login";

"Register to request access to Mobile Tech Room.":

$("authButton").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;
const name=$("registerName").value.trim();
const phone=$("registerPhone")?.value.trim()||"";

if(!email||!password){authMessage("Enter your email and password.");return}
if(password.length<6){authMessage("Password must have at least 6 characters.");return}
if(registerMode&&!name){authMessage("Enter your full name.");return}
if(registerMode&&!phone){authMessage("Enter your WhatsApp or phone number.");return}

$("authButton").disabled=true;
authMessage("Please wait...");

try{
if(registerMode){
registrationInProgress=true;
try{
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
const profileRef=doc(db,"users",result.user.uid);
await setDoc(profileRef,{
fullName:name,phone:phone,email:email,role:"student",
status:"pending",createdAt:serverTimestamp()
});
const savedProfile=await getDoc(profileRef);
if(!savedProfile.exists())throw new Error("Your account was created, but its student profile could not be verified. Please contact the administrator.");
await signOut(auth);
authMessage("Registration successful. Your account is waiting for approval.");
}catch(registrationError){
if(auth.currentUser)await signOut(auth);
throw registrationError;
}finally{
registrationInProgress=false;
}
}else{
await signInWithEmailAndPassword(auth,email,password);
}
}catch(error){
const errors={
"auth/email-already-in-use":"This email is already registered.",
"auth/invalid-email":"Invalid email address.",
"auth/invalid-credential":"Incorrect email or password.",
"permission-denied":"Firebase permissions need checking."

authMessage(errors[error.code]||error.message);
}finally{$("authButton").disabled=false}
};

}catch(e){authMessage(e.message)}
};

onAuthStateChanged(auth,async user=>{

}

try{

if(!snap.exists()){

$("appPanel").classList.add("hidden");

$("recoverProfileButton").onclick=async()=>{
const fullName=$("recoveryName").value.trim();
const phone=$("recoveryPhone").value.trim();
if(!fullName){$("recoveryStatus").textContent="Please enter your full name.";return}
if(fullName.length>120){$("recoveryStatus").textContent="Your name must be 120 characters or fewer.";return}

recoveryButton.disabled=true;

try{

await setDoc(profileRef,{

email:user.email,
role:"student",
status:"pending",
createdAt:serverTimestamp()
});
const restored=await getDoc(profileRef);
if(!restored.exists())throw new Error("The profile could not be verified. Please contact the administrator.");

authMessage("Your student profile has been restored. Please log in again. Your account is waiting for administrator approval.");

};
return;
}
profile=snap.data();

}

$("authPanel").classList.add("hidden");

(profile.role||"student").toUpperCase()+" · "+(profile.status||"pending").toUpperCase();

</div>`;
$("navigation").innerHTML="";
return;
}
buildNavigation();
await showTab("dashboard");
}catch(e){

}
});

async function loadCourses(){
  let q;

  if(isAdmin()){
    q=collection(db,"courses");
  }else if(isInstructor()){
    q=query(
      collection(db,"courses"),
      where("createdBy","==",currentUser.uid)
    );
  }else{
    q=query(
      collection(db,"courses"),
      where("status","==","published")
    );
  }

  const snap=await getDocs(q);
  courses=snap.docs.map(d=>({id:d.id,...d.data()}));
}

function bindLessonFormControls({accessId=null,priceFieldId=null,priceId=null,typeId,writtenId,mediaId,contentId}) {
  const access=accessId?$(accessId):null;
  const priceField=priceFieldId?$(priceFieldId):null;
  const price=priceId?$(priceId):null;
  const type=$(typeId);
  const written=$(writtenId);
  const media=$(mediaId);
  const content=contentId?$(contentId):null;
  const update=()=>{
    if(access&&priceField&&price){
      const paid=access.value==="paid";
      priceField.classList.toggle("hidden",!paid);
      price.required=paid;
      if(!paid)price.value="";
    }
    const isWritten=type.value==="written";
    written.classList.toggle("hidden",!isWritten);
    media.classList.toggle("hidden",isWritten);
    if(content)content.setAttribute("aria-hidden",String(!isWritten));
  };
  if(access)access.addEventListener("change",update);
  type.addEventListener("change",update);
  update();
}

 const progressKey=`mtr_progress_${currentUser.uid}_${courseId}`;
 let completed=[];try{completed=JSON.parse(localStorage.getItem(progressKey)||"[]");if(!Array.isArray(completed))completed=[];}catch(_){}
 let activeIndex=0;
 const drawRoom=()=>{
  const lesson=lessons[activeIndex],done=completed.includes(lesson.id),percent=Math.round(completed.length/lessons.length*100);

 };

 page.onclick=event=>{

 };

  finally{uploadButton.disabled=false;}
};
const form=$("lessonForm");
if(form)form.onsubmit=async e=>{
e.preventDefault();
try{
const url=$("lessonUrl").value.trim(),lessonType=$("lessonType").value;
if(lessonType==="written"&&!$("lessonContent").innerText.trim()){appMessage("Write the lesson document before saving.","error");return;}

}
await addDoc(collection(db,"courses",courseId,"lessons"),{
title:$("lessonTitle").value.trim(),
topic:$("lessonTopic").value.trim(),
section:$("lessonSection").value.trim(),
type:lessonType,
content:lessonType==="written"?$("lessonContent").innerHTML.trim():"",

}catch(e){

async function editCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can edit lesson topics.","error");
return;
}
const c=courses.find(x=>x.id===id);
if(!c)return;
const title=prompt("Lesson topic name:",c.title);
if(title===null)return;
const description=prompt("Describe what these lessons cover:",c.description||"");
if(description===null)return;
try{
await updateDoc(doc(db,"courses",id),{
title:title.trim(),description:description.trim()
});
appMessage("Lesson topic updated.");
await renderCourses();
}catch(e){appMessage(e.message,"error")}
}

async function deleteCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can delete lesson topics.","error");
return;
}
if(!confirm("Delete this lesson topic and all its lessons?"))return;
try{
const lessons=await getDocs(collection(db,"courses",id,"lessons"));
for(const l of lessons.docs){
await deleteDoc(doc(db,"courses",id,"lessons",l.id));
}
await deleteDoc(doc(db,"courses",id));
appMessage("Lesson topic deleted.");
await renderCourses();
}catch(e){appMessage("Could not delete lesson topic: "+e.message,"error")}
}

async function editLesson(id){

}

async function renderUsers(role){
page.innerHTML="<div class='panel'>Loading accounts...</div>";
try{
const snap=await getDocs(collection(db,"users"));
users=snap.docs.map(d=>({id:d.id,...d.data()}))
.filter(u=>u.role===role);
let html=`<div class="panel">
<h2>${role==="student"?"Student Management":"Instructor Management"}</h2>
<p class="muted">Manage account permissions and access.</p>
</div>`;

if(!users.length)html+=`<div class="panel">No ${role} accounts found.</div>`;

users.forEach(u=>{
html+=`
<div class="card">
<h3>${safe(u.fullName||"Unnamed account")}</h3>
<p>${safe(u.email)}</p>
${u.phone?`<p>Phone: ${safe(u.phone)}</p>`:""}
<span class="tag">${safe(u.role)}</span>
<span class="tag">${safe(u.status)}</span>
<div class="actions">
${role==="student"&&u.status!=="approved"?
`<button data-action="approve-user" data-id="${safe(u.id)}">Approve</button>`:""}
${u.status!=="blocked"?
`<button class="danger" data-action="block-user" data-id="${safe(u.id)}">Block</button>`:
`<button data-action="unblock-user" data-id="${safe(u.id)}">Restore</button>`}
${role==="student"&&u.status==="approved"?
`<button class="secondary" data-action="manage-enrollments" data-id="${safe(u.id)}">Manage Course Access</button>
<button class="secondary" data-action="promote-user" data-id="${safe(u.id)}">Make Instructor</button>`:""}
${role==="instructor"?
`<button class="secondary" data-action="demote-user" data-id="${safe(u.id)}">Return to Student</button>`:""}
</div>
</div>`;
});
page.innerHTML=html;
}catch(e){
page.innerHTML=`<div class="panel error">Could not load accounts: ${safe(e.message)}</div>`;
}
}

async function manageStudentEnrollments(studentId){
  if(!isAdmin())return;
  const student=users.find(u=>u.id===studentId);
  if(!student){appMessage("Student account not found.","error");return;}
  page.innerHTML="<div class='panel'>Loading paid course access...</div>";
  try{
    const courseSnap=await getDocs(collection(db,"courses"));
    const paidCourses=courseSnap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(c=>c.accessType==="paid"&&c.status==="published");
    const enrollmentSnap=await getDocs(collection(db,"users",studentId,"enrollments"));
    const enrollmentMap=new Map(enrollmentSnap.docs.map(d=>[d.id,d.data()]));
    let html=`<div class="panel">
      <button class="secondary" data-action="back-students">Back to Students</button>
      <h2>Paid Course Access</h2>
      <p><strong>${safe(student.fullName||"Student")}</strong></p>
      <p class="muted">${safe(student.email||"")}</p>
      <p class="muted">Grant or revoke access to a whole course. One approval unlocks every lesson inside that course.</p>
    </div>`;
    if(!paidCourses.length)html+=`<div class="panel">There are no published paid courses.</div>`;
    for(const course of paidCourses){
      const active=enrollmentMap.get(course.id)?.status==="active";
      html+=`<div class="card">
        <h3>${safe(course.title)}</h3>
        <p>One-time course price (all lessons): MK ${safe(Number(course.price??0).toLocaleString('en-US'))}</p>
        <span class="tag">${active?"Full course access active":"No course access yet"}</span>
        <div class="actions">${active
          ? `<button class="danger" data-action="revoke-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Revoke Course Access</button>`
          : `<button data-action="grant-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Grant Full Course Access</button>`}
        </div>
      </div>`;
    }
    page.innerHTML=html;
  }catch(e){page.innerHTML=`<div class="panel error">Could not load course access: ${safe(e.message)}</div>`;}
}

async function grantEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Grant this student full access to every lesson in the selected paid course?"))return;
  try{
    const courseSnap=await getDoc(doc(db,"courses",courseId));
    if(!courseSnap.exists())throw new Error("Course not found.");
    const course=courseSnap.data();
    if(course.accessType!=="paid"||course.status!=="published")
      throw new Error("Only published paid courses can be enrolled.");
    await setDoc(doc(db,"users",studentId,"enrollments",courseId),{
      status:"active",courseId:courseId,courseTitle:course.title||"",
      grantedBy:currentUser.uid,grantedAt:serverTimestamp()
    });
    appMessage("Full course access granted. All lessons are unlocked.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not grant course access: "+e.message,"error");}
}

async function revokeEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Revoke this student's access to the entire course?"))return;
  try{
    await deleteDoc(doc(db,"users",studentId,"enrollments",courseId));
    appMessage("Course access revoked.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not revoke access: "+e.message,"error");}
}

async function changeUser(id,changes,success){
try{
await updateDoc(doc(db,"users",id),changes);
appMessage(success);
await renderUsers(currentTab==="students"?"student":"instructor");
}catch(e){appMessage("Could not update account: "+e.message,"error")}
}

showTab(dashboardButton.dataset.dashboardTab);
return;
}
const b=e.target.closest("[data-action]");

const action=b.dataset.action;
const id=b.dataset.id;

try{
if(action==="download-lesson-pdf"){downloadLessonPdf(b);return;}
if(action==="view-media"){
  const mediaUrl=b.dataset.mediaUrl||"",mediaType=b.dataset.mediaType||"",mediaTitle=b.dataset.mediaTitle||"Lesson media";
  if(!/^https:\/\/.+/i.test(mediaUrl)){appMessage("This media link is not valid.","error");return;}
  document.getElementById("lessonMediaViewer")?.remove();
  const viewer=document.createElement("div");
  viewer.id="lessonMediaViewer";viewer.className="media-lightbox";
  const inner=document.createElement("div");inner.className="media-lightbox-inner";
  const close=document.createElement("button");close.type="button";close.className="media-lightbox-close";close.textContent="✕ Close";
  close.addEventListener("click",()=>viewer.remove());
  const heading=document.createElement("h3");heading.className="media-lightbox-title";heading.textContent=mediaTitle;
  inner.append(close,heading);
  if(mediaType==="image"){
    const img=document.createElement("img");img.className="media-lightbox-content";img.src=mediaUrl;img.alt=mediaTitle;inner.append(img);
  }else if(mediaType==="video"){
    const video=document.createElement("video");video.className="media-lightbox-content";video.controls=true;video.autoplay=true;video.playsInline=true;video.src=mediaUrl;inner.append(video);
    video.addEventListener("error",()=>appMessage("This video could not be played. Please check the uploaded file.","error"));
  }
  viewer.append(inner);viewer.addEventListener("click",event=>{if(event.target===viewer)viewer.remove();});
  document.body.append(viewer);
  return;
}
if(action==="open-course")await openCourse(id);
    if(action==="manage-enrollments"&&isAdmin())await manageStudentEnrollments(id);
    if(action==="back-students"&&isAdmin())await renderUsers("student");
    if(action==="grant-enrollment"&&isAdmin())await grantEnrollment(b.dataset.student,b.dataset.course);
    if(action==="revoke-enrollment"&&isAdmin())await revokeEnrollment(b.dataset.student,b.dataset.course);
if(action==="back-courses")await renderCourses();
if(action==="edit-course"&&isAdmin())await editCourse(id);
if(action==="delete-course"&&isAdmin())await deleteCourse(id);
if(action==="edit-lesson"&&isAdmin())await editLesson(id);
if(action==="delete-lesson"&&isAdmin())await deleteLesson(id);

if(action==="approve-user"&&isAdmin())
await changeUser(id,{status:"approved"},"Student approved.");

if(action==="block-user"&&isAdmin()){

}

if(action==="unblock-user"&&isAdmin())

if(action==="promote-user"&&isAdmin()){
if(confirm("Give this account instructor permissions?"))
await changeUser(id,{role:"instructor",status:"approved"},"Instructor permissions granted.");

if(action==="demote-user"&&isAdmin()){
if(confirm("Remove instructor permissions?"))
await changeUser(id,{role:"student",status:"approved"},"Instructor permissions removed.");
}
}catch(error){appMessage(error.message,"error")}
});

/* Display all-capital labels in readable sentence case and a softer accent. */
(()=>{
 const skip='SCRIPT,STYLE,TEXTAREA,INPUT,SELECT,OPTION,[contenteditable="true"]';
 const accent=(root)=>{
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
   const value=node.nodeValue||"";
   if(!/[A-Z]{2,}/.test(value))continue;
   const parent=node.parentElement;
   if(!parent||parent.closest(skip)||parent.classList.contains('uppercase-accent'))continue;
   if(!/[a-z]/.test(value)){
    const readable=value.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,prefix,letter)=>prefix+letter.toUpperCase());
    const span=document.createElement('span');
    span.className='uppercase-accent';span.textContent=readable;
    node.parentNode.replaceChild(span,node);
   }
  }
 };
 const run=()=>accent(document.body);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
 new MutationObserver(()=>run()).observe(document.body,{childList:true,subtree:true});
})();
