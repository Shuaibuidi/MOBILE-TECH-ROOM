function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function formatLessonContent(value){
  const raw=String(value||"");
  if(!/[<](p|div|h1|h2|h3|strong|b|em|i|u|blockquote|ul|ol|li|span|font)(\s|>)/i.test(raw)) return safe(raw).replace(/\n/g,"<br>");
  const doc=new DOMParser().parseFromString(raw,"text/html");
  const allowed=new Set(["P","DIV","H1","H2","H3","STRONG","B","EM","I","U","BLOCKQUOTE","UL","OL","LI","BR","SPAN"]);
  const safeStyle=(el)=>{
    const styles=[];
    const color=el.style?.color||"";
    const bg=el.style?.backgroundColor||"";
    const family=el.style?.fontFamily||"";
    const size=el.style?.fontSize||"";
    const align=el.style?.textAlign||"";
    if(/^(#[0-9a-f]{3,8}|rgb\([\d\s,%.]+\)|[a-z]{3,20})$/i.test(color))styles.push(`color:${color}`);
    if(/^(#[0-9a-f]{3,8}|rgb\([\d\s,%.]+\)|[a-z]{3,20})$/i.test(bg))styles.push(`background-color:${bg}`);
    if(/^[a-z ,'-]{2,60}$/i.test(family))styles.push(`font-family:${family}`);
    if(/^([1-7]\d|[1-5]\d|6\d)px$/.test(size))styles.push(`font-size:${size}`);
    if(["left","right","center","justify"].includes(align))styles.push(`text-align:${align}`);
    return styles.length?` style="${safe(styles.join(";"))}"`:"";
  };
  function clean(node){
    let out="";
    for(const child of node.childNodes){
      if(child.nodeType===Node.TEXT_NODE){out+=safe(child.textContent);continue;}
      if(child.nodeType!==Node.ELEMENT_NODE)continue;
      const tag=child.tagName;
      if(tag==="FONT"){
        const styles=[];
        const color=child.getAttribute("color")||"";
        const face=child.getAttribute("face")||"";
        const sizes={"1":"12px","2":"14px","3":"16px","4":"18px","5":"24px","6":"32px","7":"40px"};
        if(/^#[0-9a-f]{3,8}$/i.test(color))styles.push(`color:${color}`);
        if(/^[a-z ,'-]{2,60}$/i.test(face))styles.push(`font-family:${face}`);
        if(sizes[child.getAttribute("size")])styles.push(`font-size:${sizes[child.getAttribute("size")]}`);
        out+=`<span${styles.length?` style="${safe(styles.join(";"))}"`:""}>${clean(child)}</span>`;
        continue;
      }
      if(!allowed.has(tag)){out+=clean(child);continue;}
      out+=`<${tag.toLowerCase()}${safeStyle(child)}>${clean(child)}</${tag.toLowerCase()}>`;
    }
    return out;
  }
  return clean(doc.body);
}

async function downloadLessonPdf(button){
  const card=button.closest(".card");
  if(!card)return;
  const title=card.querySelector("h3")?.textContent||"Lesson";
  const content=card.querySelector(".lesson-body")?.innerHTML||"";
  const cleanTitle=title.replace(/^\d+\.\s*/,"");

  const printHtml=`<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${safe(cleanTitle)} - Mobile Tech Room</title>
<style>
:root{--ink:#172b45;--teal:#087f78;--gold:#c47b32}*{box-sizing:border-box}
html{background:#e8edf2;min-height:100%;}body{margin:0;min-height:100vh;padding:12px 14px 20px;font-family:Arial,Helvetica,sans-serif;color:#263445;line-height:1.7}
.sheet{width:min(100%,210mm);min-height:297mm;margin:0 auto;background:#fff;padding:14mm}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:5px solid var(--teal);border-bottom:1px solid #cbd6df;padding:12px 0 10px;margin-bottom:28px}
.brand-name{font-family:Georgia,serif;font-weight:700;letter-spacing:3px;color:#124b49;font-size:15px}.brand-tag{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:700;text-align:right}
.kicker{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 8px}
h1{font-family:Georgia,'Times New Roman',serif;color:#124b49;font-size:30px;line-height:1.2;margin:0 0 18px;padding-bottom:13px;border-bottom:3px solid var(--teal);overflow-wrap:anywhere}
article{font-size:15px;overflow-wrap:anywhere}article h1{font-size:26px}article h2{font-family:Georgia,serif;color:#126b66;font-size:22px;margin:24px 0 10px}article h3{color:#a85e26;font-size:18px;margin:20px 0 8px}
article p{margin:0 0 13px}article ul,article ol{padding-left:25px;margin:8px 0 18px}article li{padding:3px 0}
article blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--gold);background:#f3f7f6;color:#344455}
article img{max-width:100%;height:auto}article table{width:100%;border-collapse:collapse;max-width:100%;font-size:14px}article td,article th{border:1px solid #d7e0e5;padding:7px;text-align:left}article pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f8;padding:12px;border-radius:6px}
@page{size:A4 portrait;margin:14mm}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}.sheet{max-width:none;min-height:0;margin:0;padding:0;box-shadow:none}.brand,*{-webkit-print-color-adjust:exact;print-color-adjust:exact}h1,h2,h3,blockquote{break-after:avoid}p,li,table,img,blockquote{break-inside:avoid}}
</style></head><body><main class="sheet"><header class="brand"><div class="brand-name">MOBILE TECH ROOM</div><div class="brand-tag">LEARN • REPAIR • INNOVATE</div></header>
<p class="kicker">MOBILE TECH LESSON</p><h1>${safe(cleanTitle)}</h1><article>${content}</article></main></body></html>`;

  // Capacitor Android: use the native Android Print Framework, not window.print().
  if(window.location.hostname==="localhost" || window.location.protocol==="capacitor:" || window.Capacitor?.isNativePlatform?.()){
    try{
      const { Printer } = await import("@capgo/capacitor-printer");
      await Printer.printHtml({html:printHtml});
      appMessage("Android print screen opened. Choose ‘Save as PDF’ to save this lesson.","success");
    }catch(error){
      console.error("Native lesson PDF printing failed:",error);
      appMessage("Could not open Android PDF printing. Please try again.","error");
    }
    return;
  }

  // Website fallback: show the print-ready lesson in an in-app preview.
  document.getElementById("lessonPdfPreview")?.remove();
  const overlay=document.createElement("div");
  overlay.id="lessonPdfPreview";
  overlay.style.cssText="position:fixed;inset:0;z-index:99999;background:#172b45;display:flex;flex-direction:column;padding:10px;gap:10px";
  const toolbar=document.createElement("div");
  toolbar.style.cssText="display:flex;gap:10px;justify-content:center;flex-wrap:wrap";
  const printButton=document.createElement("button");
  printButton.type="button";
  printButton.textContent="⬇ Save / Print PDF";
  printButton.style.cssText="border:0;border-radius:8px;padding:12px 18px;background:#087f78;color:white;font-size:15px;font-weight:700";
  const closeButton=document.createElement("button");
  closeButton.type="button";
  closeButton.textContent="Close";
  closeButton.style.cssText="border:0;border-radius:8px;padding:12px 18px;background:#536579;color:white;font-size:15px;font-weight:700";
  toolbar.append(printButton,closeButton);
  const frame=document.createElement("iframe");
  frame.title="Lesson PDF preview";
  frame.style.cssText="width:100%;flex:1;min-height:0;border:0;border-radius:8px;background:#fff";
  overlay.append(toolbar,frame);
  document.body.appendChild(overlay);
  frame.srcdoc=printHtml;
  printButton.addEventListener("click",()=>{
    try{frame.contentWindow.focus();frame.contentWindow.print();}
    catch(error){appMessage("Could not open PDF printing. Please use Chrome to print this lesson.","error");}
  });
  closeButton.addEventListener("click",()=>overlay.remove());
}
function appMessage(text,type="success"){
$("appMessage").innerHTML=`<p class="${type}">${safe(text)}</p>`;
}

function isAdmin(){return profile?.role==="admin"&&profile?.status==="approved"}
function isInstructor(){return profile?.role==="instructor"&&profile?.status==="approved"}
function isStaff(){return isAdmin()||isInstructor()}
function isStudent(){return profile?.role==="student"&&profile?.status==="approved"}

function authMessage(text){$("message").textContent=text}

function switchAuth(){
registerMode=!registerMode;
$("registerFields").classList.toggle("hidden",!registerMode);
$("authTitle").textContent=registerMode?"Create Student Account":"Student Login";
$("authDescription").textContent=registerMode?
"Register to request access to Mobile Tech Room.":
"Sign in to your learning account.";
$("authButton").textContent=registerMode?"Register Account":"Login";
$("forgotButton").classList.toggle("hidden",registerMode);
$("switchText").innerHTML=registerMode?
'Already registered? <a href="#" id="switchButton">Login here</a>':
'No account? <a href="#" id="switchButton">Register here</a>';
authMessage("");
}

$("switchButton").onclick=e=>{e.preventDefault();switchAuth()};

$("authButton").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;
const name=$("registerName").value.trim();

if(!email||!password){authMessage("Enter your email and password.");return}
if(password.length<6){authMessage("Password must have at least 6 characters.");return}
if(registerMode&&!name){authMessage("Enter your full name.");return}

$("authButton").disabled=true;
authMessage("Please wait...");

try{
if(registerMode){
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
await setDoc(doc(db,"users",result.user.uid),{
fullName:name,email:email,role:"student",
status:"pending",createdAt:serverTimestamp()
});
authMessage("Registration successful. Your account is waiting for approval.");
}else{
await signInWithEmailAndPassword(auth,email,password);
}
}catch(error){
const errors={
"auth/email-already-in-use":"This email is already registered.",
"auth/invalid-email":"Invalid email address.",
"auth/invalid-credential":"Incorrect email or password.",
"permission-denied":"Firebase permissions need checking."
};
authMessage(errors[error.code]||error.message);
}finally{$("authButton").disabled=false}
};

$("forgotButton").onclick=async()=>{
const email=$("email").value.trim();
if(!email){authMessage("Enter your email address first.");return}
try{
await sendPasswordResetEmail(auth,email);
authMessage("Password reset email sent. Check your inbox.");
}catch(e){authMessage(e.message)}
};

$("logoutButton").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
currentUser=user;
if(!user){
profile=null;
$("authPanel").classList.remove("hidden");
$("appPanel").classList.add("hidden");
return;
}

try{
const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()){
await signOut(auth);
authMessage("Account profile not found.");
return;
}
profile=snap.data();

if(profile.status==="blocked"){
await signOut(auth);
authMessage("Your account has been blocked. Contact the administrator.");
return;
}

$("authPanel").classList.add("hidden");
$("appPanel").classList.remove("hidden");
$("welcomeTitle").textContent="Welcome, "+(profile.fullName||user.email);
$("accountInfo").textContent=
(profile.role||"student").toUpperCase()+" · "+(profile.status||"pending").toUpperCase();

if(profile.status!=="approved"){
page.innerHTML=`<div class="panel">
<h2>Account Pending Approval</h2>
<p>Your registration is waiting for administrator approval.</p>
<p class="muted">Please return later or contact the administrator.</p>
</div>`;
$("navigation").innerHTML="";
return;
}
buildNavigation();
await showTab("dashboard");
}catch(e){
page.innerHTML=`<div class="panel">Unable to load account: ${safe(e.message)}</div>`;
}
});

function buildNavigation(){
let tabs=[];
if(isAdmin())tabs=["dashboard","students","lessons","instructors"];
else if(isInstructor())tabs=["dashboard","lessons"];
else if(isStudent())tabs=["dashboard","lessons"];

$("navigation").innerHTML=tabs.map(t=>
`<button class="${currentTab===t?"active":"secondary"}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`
).join("");
}

$("navigation").onclick=e=>{
const b=e.target.closest("[data-tab]");
if(b)showTab(b.dataset.tab);
};

async function showTab(tab){
currentTab=tab;
buildNavigation();
$("appMessage").innerHTML="";
selectedCourse=null;

if(tab==="dashboard")await renderDashboard();
if(tab==="lessons")await renderCourses();
if(tab==="students"&&isAdmin())await renderUsers("student");
if(tab==="instructors"&&isAdmin())await renderUsers("instructor");
}

async function renderDashboard(){
  page.innerHTML=`<div class="panel">Loading your dashboard...</div>`;

  const name=profile?.fullName||currentUser?.displayName||currentUser?.email||"Learner";
  const email=profile?.email||currentUser?.email||"Not available";
  const role=(profile?.role||"student").toLowerCase();
  const status=(profile?.status||"pending").toLowerCase();

  let stats=[];
  let quickActions="";
  let tip="Keep learning consistently. Practise each topic and review your lessons regularly.";

  try{
    if(isAdmin()){
      const [userSnap,courseSnap]=await Promise.all([
        getDocs(collection(db,"users")),
        getDocs(collection(db,"courses"))
      ]);
      const allUsers=userSnap.docs.map(d=>d.data());
      const students=allUsers.filter(u=>u.role==="student");
      const pending=students.filter(u=>u.status!=="approved");
      const instructors=allUsers.filter(u=>u.role==="instructor"&&u.status==="approved");
      stats=[
        {value:students.length,label:"Registered students"},
        {value:pending.length,label:"Pending approvals"},
        {value:instructors.length,label:"Active instructors"},
        {value:courseSnap.size,label:"Lesson topics"}
      ];
      quickActions=`
        <button data-dashboard-tab="students">Manage Students</button>
        <button data-dashboard-tab="lessons">Manage Lessons</button>
        <button data-dashboard-tab="instructors">Manage Instructors</button>`;
      tip="Keep student approvals and instructor accounts up to date, and review lesson topics before publishing.";
    }else if(isInstructor()){
      await loadCourses();
      const lessonCounts=await Promise.all(courses.map(async course=>{
        try{
          const snap=await getDocs(collection(db,"courses",course.id,"lessons"));
          return snap.size;
        }catch(error){
          return 0;
        }
      }));
      const lessonCount=lessonCounts.reduce((sum,count)=>sum+count,0);
      const published=courses.filter(c=>c.status==="published").length;
      stats=[
        {value:courses.length,label:"My lesson topics"},
        {value:published,label:"Published lesson topics"},
        {value:lessonCount,label:"Lessons created"}
      ];
      quickActions=`<button data-dashboard-tab="lessons">Open My Lessons</button>`;
      tip="Build clear, practical lessons. Use headings, examples and step-by-step explanations to help students learn phone technology.";
    }else if(isStudent()){
      const [courseSnap,enrollmentSnap]=await Promise.all([
        getDocs(query(collection(db,"courses"),where("status","==","published"))),
        getDocs(collection(db,"users",currentUser.uid,"enrollments"))
      ]);
      const activeEnrollments=enrollmentSnap.docs.filter(d=>d.data().status==="active");
      const activeCourseIds=new Set(activeEnrollments.map(d=>d.id));
      const availableCourses=courseSnap.docs.filter(d=>{
        const course=d.data();
        return course.accessType!=="paid"||activeCourseIds.has(d.id);
      });
      stats=[
        {value:courseSnap.size,label:"Published lesson topics"},
        {value:availableCourses.length,label:"Lesson topics available to you"},
        {value:activeEnrollments.length,label:"Active paid-lesson access"}
      ];
      quickActions=`<button data-dashboard-tab="lessons">Explore Lessons</button>`;
      tip="Start with the fundamentals, follow each lesson in order and practise safely on suitable devices.";
    }
  }catch(error){
    stats=[];

async function loadCourses(){
  let q;

  if(isAdmin()){
    q=collection(db,"courses");
  }else if(isInstructor()){
    q=query(
      collection(db,"courses"),
      where("createdBy","==",currentUser.uid)
    );
  }else{
    q=query(
      collection(db,"courses"),
      where("status","==","published")
    );
  }

  const snap=await getDocs(q);
  courses=snap.docs.map(d=>({id:d.id,...d.data()}));
}

page.innerHTML="<div class='panel'>Loading lessons...</div>";
try{
await loadCourses();
let html=`<div class="panel"><h2>Lessons</h2>

<option value="paid">Paid Lessons</option>
</select>
<input id="coursePrice" type="number" min="0" placeholder="Lesson access price (optional)">

html+="</div>";

for(const c of courses){

<p class="muted">Topic ID: ${safe(c.id)}</p>

${isAdmin()?`

async function createCourse(e){
e.preventDefault();
try{
await addDoc(collection(db,"courses"),{
title:$("courseTitle").value.trim(),
category:$("courseCategory").value.trim(),
description:$("courseDescription").value.trim(),
accessType:$("courseAccess").value,
price:Number($("coursePrice").value||0),
status:$("courseStatus").value,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
});
appMessage("Lesson topic created successfully.");
await renderCourses();
}catch(e){appMessage("Could not create lesson topic: "+e.message,"error")}
}

async function openCourse(id){
selectedCourse=courses.find(c=>c.id===id);
if(!selectedCourse){appMessage("Lesson topic not found.","error");return}

if(isStudent()){
if(selectedCourse.accessType==="paid"){
const enrollment=await getDoc(doc(db,"users",currentUser.uid,"enrollments",id));
if(!enrollment.exists()||enrollment.data().status!=="active"){
page.innerHTML=`<div class="panel">
<h2>${safe(selectedCourse.title)}</h2>
<p>These lessons require paid access. You do not currently have access.</p>
<p class="muted">Contact the administrator to arrange payment and lesson access.</p>
<button class="secondary" data-action="back-courses">Back to Lessons</button>
</div>`;
return;
}
}
}

await renderLessons(id);
}

async function renderLessons(courseId){
page.innerHTML="<div class='panel'>Loading lessons...</div>";
try{
const snap=await getDocs(collection(db,"courses",courseId,"lessons"));
const lessons=snap.docs.map(d=>({id:d.id,...d.data()}));
let html=`
<div class="panel">
<button class="secondary" data-action="back-courses">Back to Lessons</button>
<h2>${safe(selectedCourse.title)}</h2>
<p>${safe(selectedCourse.description)}</p>
</div>`;

if(isStaff()){
html+=`
<div class="panel">
<h3>Add New Lesson</h3>
<form id="lessonForm">
<input id="lessonTitle" placeholder="Lesson title" required>
<label class="muted" for="lessonTopic">Topic</label>
<input id="lessonTopic" placeholder="Enter the topic (e.g. Android Basics)" required>
<label class="muted" for="lessonSection">Section</label>
<input id="lessonSection" placeholder="Enter the section (e.g. Introduction, Tools, Practical Steps)" required>
<select id="lessonType">
<option value="written">Written Lesson</option>
<option value="video">Video Link</option>
<option value="audio">Audio Link</option>
<option value="pdf">PDF Link</option>
<option value="image">Image Link</option>
</select>
<label for="lessonStyle" class="muted">Choose text style</label>
<div class="editor-toolbar">
<select id="lessonStyle" aria-label="Paragraph style"><option value="P">Normal paragraph</option><option value="H1">Title heading</option><option value="H2">Section heading</option><option value="H3">Small heading</option><option value="BLOCKQUOTE">Quote box</option></select>
<select id="lessonFont" aria-label="Font family"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option><option value="Trebuchet MS">Trebuchet MS</option><option value="Courier New">Courier New</option><option value="Impact">Impact</option></select>
<select id="lessonSize" aria-label="Font size"><option value="2">Small</option><option value="3" selected>Normal</option><option value="4">Large</option><option value="5">Extra large</option><option value="6">Huge</option></select>
<button type="button" class="secondary" data-editor="bold"><b>B</b></button><button type="button" class="secondary" data-editor="italic"><i>I</i></button><button type="button" class="secondary" data-editor="underline"><u>U</u></button>
<button type="button" class="secondary" data-editor="insertUnorderedList">• List</button>
<button type="button" class="secondary" data-editor="justifyLeft">Left</button><button type="button" class="secondary" data-editor="justifyCenter">Center</button><button type="button" class="secondary" data-editor="justifyRight">Right</button>
<label class="muted" for="lessonTextColor">Text</label><input id="lessonTextColor" type="color" value="#202938" aria-label="Text color">
<label class="muted" for="lessonHighlight">Highlight</label><input id="lessonHighlight" type="color" value="#fff2a8" aria-label="Highlight color">
</div>
<div id="lessonContent" class="lesson-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write your lesson here..."></div>
<input id="lessonUrl" type="url" placeholder="Optional external media URL (https://...)">
<label class="muted" for="lessonFile">Or choose an image, video, audio or PDF file (maximum 50 MB)</label>
<input id="lessonFile" type="file" accept="*/*">
<button type="button" class="secondary" id="uploadLessonFile">Upload Selected File</button>
<p id="uploadStatus" class="muted">Only approved administrators and instructors can upload.</p>
<button type="submit">Save Lesson</button>
</form>
</div>`;
}

if(!lessons.length)html+=`<div class="panel">No lessons have been added yet.</div>`;

lessons.forEach((l,i)=>{
html+=`
<div class="card">
<h3>${i+1}. ${safe(l.title)}</h3>
${l.topic?`<p><strong>Topic:</strong> ${safe(l.topic)}</p>`:""}
${l.section?`<p><strong>Section:</strong> ${safe(l.section)}</p>`:""}
<span class="tag">${safe(l.type||"written")}</span>
<div class="lesson-body">${formatLessonContent(l.content||"")}</div>
${(l.type||"written")==="written"?`<button type="button" class="secondary" data-action="download-lesson-pdf"><span>⬇ Download PDF</span></button>`:""}
${l.mediaUrl?((l.type==="image")?`<p><img src="${safe(l.mediaUrl)}" alt="${safe(l.title)}" style="max-width:100%;height:auto;border-radius:10px"></p>`:(l.type==="video")?`<video controls playsinline preload="metadata" style="width:100%;max-height:420px;border-radius:10px" src="${safe(l.mediaUrl)}"></video>`:(l.type==="audio")?`<audio controls preload="metadata" style="width:100%;margin:12px 0" src="${safe(l.mediaUrl)}"></audio>`:(l.type==="pdf")?`<div style="margin:12px 0"><iframe src="${safe(l.mediaUrl)}#toolbar=1" title="${safe(l.title)}" style="width:100%;height:650px;border:0;border-radius:10px;background:#fff"></iframe><p><a href="${safe(l.mediaUrl)}" target="_blank" rel="noopener noreferrer">Open or download PDF</a></p></div>`:`<p><a href="${safe(l.mediaUrl)}" target="_blank" rel="noopener noreferrer">Open learning material</a></p>`):""}
${isAdmin()?`
<div class="actions">
<button class="secondary" data-action="edit-lesson" data-id="${safe(l.id)}">Edit</button>
<button class="danger" data-action="delete-lesson" data-id="${safe(l.id)}">Delete</button>

});

page.innerHTML=html;
const editor=$("lessonContent");
const styleSelect=$("lessonStyle");
const textColor=$("lessonTextColor");
if(editor){
  styleSelect.onchange=()=>{editor.focus();document.execCommand("formatBlock",false,styleSelect.value);};
  $("lessonFont").onchange=()=>{editor.focus();document.execCommand("fontName",false,$("lessonFont").value);};
  $("lessonSize").onchange=()=>{editor.focus();document.execCommand("fontSize",false,$("lessonSize").value);};
  document.querySelectorAll("[data-editor]").forEach(btn=>btn.onclick=()=>{editor.focus();document.execCommand(btn.dataset.editor,false,null);});
  textColor.oninput=()=>{editor.focus();document.execCommand("foreColor",false,textColor.value);};
  $("lessonHighlight").oninput=()=>{editor.focus();document.execCommand("hiliteColor",false,$("lessonHighlight").value);};
}
const uploadButton=$("uploadLessonFile");
if(uploadButton)uploadButton.onclick=async()=>{
  const file=$("lessonFile").files[0];
  const status=$("uploadStatus");
  if(!file){status.textContent="Please choose an image, video, audio file or PDF first.";return;}
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const mimeByExt={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",webm:"video/webm",pdf:"application/pdf",mp3:"audio/mpeg",wav:"audio/wav",m4a:"audio/mp4",ogg:"audio/ogg",aac:"audio/aac"};
  const mime=file.type||mimeByExt[ext]||"";
  const allowed=["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm","application/pdf","audio/mpeg","audio/wav","audio/x-wav","audio/mp4","audio/x-m4a","audio/ogg","audio/webm","audio/aac"];
  if(!allowed.includes(mime)){status.textContent="Unsupported file. Choose JPG, PNG, WEBP, GIF, MP4, WEBM, PDF, MP3, WAV, M4A, OGG or AAC.";return;}
  if(file.size<=0||file.size>50*1024*1024){status.textContent="The file must be 50 MB or smaller.";return;}
  const uploadFile=file.type?file:new File([file],file.name,{type:mime});
  uploadButton.disabled=true;status.textContent="Uploading file... Please wait.";
  try{
    const token=await currentUser.getIdToken();
    const body=new FormData();body.append("file",uploadFile);body.append("courseId",courseId);
    const response=await fetch("https://uikexwoduxluqxxowcdc.supabase.co/functions/v1/staff-media-upload",{
      method:"POST",headers:{Authorization:"Bearer "+token},body
    });
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error(result.error||"Upload failed.");
    $("lessonUrl").value=result.mediaUrl;
    $("lessonType").value=mime==="application/pdf"?"pdf":(mime.startsWith("video/")?"video":(mime.startsWith("audio/")?"audio":"image"));
    status.textContent="Upload complete. Save Lesson to publish this material.";
  }catch(error){status.textContent=error.message||"Upload failed. Please try again.";}
  finally{uploadButton.disabled=false;}
};
const form=$("lessonForm");
if(form)form.onsubmit=async e=>{
e.preventDefault();
try{
const url=$("lessonUrl").value.trim();
if($("lessonFile").files.length&&!url){appMessage("Please upload the selected file before saving the lesson.","error");return;}
if(url&&!/^https:\/\/.+/i.test(url)){
appMessage("Please enter a valid HTTPS media link.","error");return;
}
await addDoc(collection(db,"courses",courseId,"lessons"),{
title:$("lessonTitle").value.trim(),
topic:$("lessonTopic").value.trim(),
section:$("lessonSection").value.trim(),
type:$("lessonType").value,
content:$("lessonContent").innerHTML.trim(),
mediaUrl:url,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
});
appMessage("Lesson saved successfully.");
await renderLessons(courseId);
}catch(e){appMessage("Could not save lesson: "+e.message,"error")}
};
}catch(e){
page.innerHTML=`<div class="panel error">Could not load lessons: ${safe(e.message)}</div>`;
}
}

async function editCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can edit lesson topics.","error");
return;
}
const c=courses.find(x=>x.id===id);
if(!c)return;
const title=prompt("Lesson topic name:",c.title);
if(title===null)return;
const description=prompt("Describe what these lessons cover:",c.description||"");
if(description===null)return;
try{
await updateDoc(doc(db,"courses",id),{
title:title.trim(),description:description.trim()
});
appMessage("Lesson topic updated.");
await renderCourses();
}catch(e){appMessage(e.message,"error")}
}

async function deleteCourse(id){
if(!isAdmin()){
appMessage("Only the administrator can delete lesson topics.","error");
return;
}
if(!confirm("Delete this lesson topic and all its lessons?"))return;
try{
const lessons=await getDocs(collection(db,"courses",id,"lessons"));
for(const l of lessons.docs){
await deleteDoc(doc(db,"courses",id,"lessons",l.id));
}
await deleteDoc(doc(db,"courses",id));
appMessage("Lesson topic deleted.");
await renderCourses();
}catch(e){appMessage("Could not delete lesson topic: "+e.message,"error")}
}

async function editLesson(id){
if(!isAdmin()){
appMessage("Only the administrator can edit lessons.","error");
return;
}
const courseId=selectedCourse.id;
const ref=doc(db,"courses",courseId,"lessons",id);
const snap=await getDoc(ref);
if(!snap.exists())return;
const l=snap.data();
const title=prompt("Lesson title:",l.title);
if(title===null)return;
const topic=prompt("Topic:",l.topic||"");
if(topic===null)return;
const section=prompt("Section:",l.section||"");
if(section===null)return;
const content=prompt("Lesson content (plain text):",l.content||"");
if(content===null)return;
try{
await updateDoc(ref,{title:title.trim(),topic:topic.trim(),section:section.trim(),content:content.trim()});
appMessage("Lesson updated.");
await renderLessons(courseId);
}catch(e){appMessage(e.message,"error")}
}

async function deleteLesson(id){
if(!isAdmin()){
appMessage("Only the administrator can delete lessons.","error");
return;
}
if(!confirm("Delete this lesson?"))return;
try{
await deleteDoc(doc(db,"courses",selectedCourse.id,"lessons",id));
appMessage("Lesson deleted.");
await renderLessons(selectedCourse.id);
}catch(e){appMessage(e.message,"error")}
}

async function renderUsers(role){
page.innerHTML="<div class='panel'>Loading accounts...</div>";
try{
const snap=await getDocs(collection(db,"users"));
users=snap.docs.map(d=>({id:d.id,...d.data()}))
.filter(u=>u.role===role);
let html=`<div class="panel">
<h2>${role==="student"?"Student Management":"Instructor Management"}</h2>
<p class="muted">Manage account permissions and access.</p>
</div>`;

if(!users.length)html+=`<div class="panel">No ${role} accounts found.</div>`;

users.forEach(u=>{
html+=`
<div class="card">
<h3>${safe(u.fullName||"Unnamed account")}</h3>
<p>${safe(u.email)}</p>
<span class="tag">${safe(u.role)}</span>
<span class="tag">${safe(u.status)}</span>
<div class="actions">
${role==="student"&&u.status!=="approved"?
`<button data-action="approve-user" data-id="${safe(u.id)}">Approve</button>`:""}
${u.status!=="blocked"?
`<button class="danger" data-action="block-user" data-id="${safe(u.id)}">Block</button>`:
`<button data-action="unblock-user" data-id="${safe(u.id)}">Restore</button>`}
${role==="student"&&u.status==="approved"?
`<button class="secondary" data-action="manage-enrollments" data-id="${safe(u.id)}">Manage Lesson Access</button>
<button class="secondary" data-action="promote-user" data-id="${safe(u.id)}">Make Instructor</button>`:""}
${role==="instructor"?
`<button class="secondary" data-action="demote-user" data-id="${safe(u.id)}">Return to Student</button>`:""}
</div>
</div>`;
});
page.innerHTML=html;
}catch(e){
page.innerHTML=`<div class="panel error">Could not load accounts: ${safe(e.message)}</div>`;
}
}

async function manageStudentEnrollments(studentId){
  if(!isAdmin())return;
  const student=users.find(u=>u.id===studentId);
  if(!student){appMessage("Student account not found.","error");return;}
  page.innerHTML="<div class='panel'>Loading paid lesson access...</div>";
  try{
    const courseSnap=await getDocs(collection(db,"courses"));
    const paidCourses=courseSnap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(c=>c.accessType==="paid"&&c.status==="published");
    const enrollmentSnap=await getDocs(collection(db,"users",studentId,"enrollments"));
    const enrollmentMap=new Map(enrollmentSnap.docs.map(d=>[d.id,d.data()]));
    let html=`<div class="panel">
      <button class="secondary" data-action="back-students">Back to Students</button>
      <h2>Paid Lesson Access</h2>
      <p><strong>${safe(student.fullName||"Student")}</strong></p>
      <p class="muted">${safe(student.email||"")}</p>
      <p class="muted">Grant or revoke access to published paid lesson topics.</p>
    </div>`;
    if(!paidCourses.length)html+=`<div class="panel">There are no published paid lesson topics.</div>`;
    for(const course of paidCourses){
      const active=enrollmentMap.get(course.id)?.status==="active";
      html+=`<div class="card">
        <h3>${safe(course.title)}</h3>
        <p>Price: ${safe(course.price??0)}</p>
        <span class="tag">${active?"Access active":"No active access"}</span>
        <div class="actions">${active
          ? `<button class="danger" data-action="revoke-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Revoke Access</button>`
          : `<button data-action="grant-enrollment" data-student="${safe(studentId)}" data-course="${safe(course.id)}">Grant Access</button>`}
        </div>
      </div>`;
    }
    page.innerHTML=html;
  }catch(e){page.innerHTML=`<div class="panel error">Could not load lesson access: ${safe(e.message)}</div>`;}
}

async function grantEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Grant this student access to the selected paid lessons?"))return;
  try{
    const courseSnap=await getDoc(doc(db,"courses",courseId));
    if(!courseSnap.exists())throw new Error("Lesson topic not found.");
    const course=courseSnap.data();
    if(course.accessType!=="paid"||course.status!=="published")
      throw new Error("Only published paid lesson topics can be enrolled.");
    await setDoc(doc(db,"users",studentId,"enrollments",courseId),{
      status:"active",courseId:courseId,courseTitle:course.title||"",
      grantedBy:currentUser.uid,grantedAt:serverTimestamp()
    });
    appMessage("Paid lesson access granted.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not grant access: "+e.message,"error");}
}

async function revokeEnrollment(studentId,courseId){
  if(!isAdmin())return;
  if(!confirm("Revoke this student's access to these lessons?"))return;
  try{
    await deleteDoc(doc(db,"users",studentId,"enrollments",courseId));
    appMessage("Lesson access revoked.");
    await manageStudentEnrollments(studentId);
  }catch(e){appMessage("Could not revoke access: "+e.message,"error");}
}

async function changeUser(id,changes,success){
try{
await updateDoc(doc(db,"users",id),changes);
appMessage(success);
await renderUsers(currentTab==="students"?"student":"instructor");
}catch(e){appMessage("Could not update account: "+e.message,"error")}
}

document.addEventListener("click",async e=>{
const dashboardButton=e.target.closest("[data-dashboard-tab]");
if(dashboardButton){
showTab(dashboardButton.dataset.dashboardTab);
return;
}
const b=e.target.closest("[data-action]");
if(!b)return;
const action=b.dataset.action;
const id=b.dataset.id;

try{
if(action==="download-lesson-pdf"){downloadLessonPdf(b);return;}
if(action==="open-course")await openCourse(id);
    if(action==="manage-enrollments"&&isAdmin())await manageStudentEnrollments(id);
    if(action==="back-students"&&isAdmin())await renderUsers("student");
    if(action==="grant-enrollment"&&isAdmin())await grantEnrollment(b.dataset.student,b.dataset.course);
    if(action==="revoke-enrollment"&&isAdmin())await revokeEnrollment(b.dataset.student,b.dataset.course);
if(action==="back-courses")await renderCourses();
if(action==="edit-course"&&isAdmin())await editCourse(id);
if(action==="delete-course"&&isAdmin())await deleteCourse(id);
if(action==="edit-lesson"&&isAdmin())await editLesson(id);
if(action==="delete-lesson"&&isAdmin())await deleteLesson(id);

if(action==="approve-user"&&isAdmin())
await changeUser(id,{status:"approved"},"Student approved.");

if(action==="block-user"&&isAdmin()){
if(confirm("Block this account?"))
await changeUser(id,{status:"blocked"},"Account blocked.");
}

if(action==="unblock-user"&&isAdmin())
await changeUser(id,{status:"approved"},"Account restored.");

if(action==="promote-user"&&isAdmin()){
if(confirm("Give this account instructor permissions?"))
await changeUser(id,{role:"instructor",status:"approved"},"Instructor permissions granted.");
}

if(action==="demote-user"&&isAdmin()){
if(confirm("Remove instructor permissions?"))
await changeUser(id,{role:"student",status:"approved"},"Instructor permissions removed.");
}
}catch(error){appMessage(error.message,"error")}
});
</script>
